<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Order Dispute — DelightVendorEdit</title><link rel="icon" href="assets/dv-logo.png"><style>
:root{--gold:#d4af37;--line:#44371c;--muted:#b8ad8d}*{box-sizing:border-box}body{margin:0;background:#080808;color:#f5f0df;font:14px Arial}.top{padding:14px;border-bottom:1px solid var(--line)}.top a{color:var(--gold);text-decoration:none;font-weight:bold}.wrap{max-width:760px;margin:22px auto;padding:0 14px 45px}h1{color:var(--gold)}.muted{color:var(--muted);font-size:12px;line-height:1.6}.panel{background:#111;border:1px solid var(--line);border-radius:14px;padding:17px;margin:12px 0}label{display:block;color:var(--gold);font-size:12px;margin:12px 0 5px}input,textarea,select{width:100%;padding:12px;border:1px solid #514321;border-radius:8px;background:#090909;color:white}textarea{min-height:120px}.btn{border:0;border-radius:9px;padding:12px 16px;background:var(--gold);color:#111;font-weight:bold;margin-top:14px}.status{padding:10px;background:#201a0d;border-radius:8px;color:#e9d38c;margin-top:10px}.case{border-bottom:1px solid #302817;padding:12px 0}.tag{color:#e9d38c;text-transform:capitalize}
</style></head><body><header class="top"><a href="purchases.html">← Back to purchases</a></header><main class="wrap"><h1>Report an order problem</h1><p class="muted">Use this form if an order was paid for but something went wrong. Our team will review the case. Submitting a dispute does not automatically issue a refund.</p><section class="panel"><form id="form"><label>Order</label><select id="order" required><option value="">Loading your orders…</option></select><label>Item (optional)</label><select id="item"><option value="">Whole order</option></select><label>Reason</label><select id="reason" required><option value="">Choose a reason</option><option>Item not delivered</option><option>Wrong item delivered</option><option>Item not as described</option><option>Seller is not responding</option><option>Duplicate payment</option><option>Refund request</option><option>Other order problem</option></select><label>Explain what happened</label><textarea id="details" minlength="10" maxlength="3000" required placeholder="Include what happened and any useful details. Do not enter passwords or OTPs."></textarea><button class="btn" id="submit" type="submit">Submit dispute</button></form><div id="status" class="status">Loading your paid orders…</div></section><section class="panel"><h2>Your previous cases</h2><div id="history" class="muted">Loading…</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(()=>{"use strict";const db=supabase.createClient("https://genlmqzkjouinofkitqt.supabase.co","sb_publishable_8uj618f_n35zeF3Fcyt5VA_xLHHOkNv");const $=id=>document.getElementById(id);let user=null,orders=[],items=[];const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));async function init(){const {data,error}=await db.auth.getUser();if(error||!data.user){location.href="login.html?redirect=dispute.html";return}user=data.user;const [o,d]=await Promise.all([db.from("orders").select("id,order_number,order_status,payment_status,total,currency,created_at").eq("customer_user_id",user.id).in("payment_status",["paid","verified","completed","success"]).order("created_at",{ascending:false}).limit(100),db.from("order_disputes").select("id,order_id,reason,status,created_at,admin_note,resolution").eq("opened_by",user.id).order("created_at",{ascending:false}).limit(100)]);if(o.error)throw o.error;if(d.error)throw d.error;orders=o.data||[];$("order").innerHTML='<option value="">Choose an order</option>'+orders.map(x=>'<option value="'+x.id+'">'+esc(x.order_number)+' · '+esc(x.order_status)+' · ₦'+Number(x.total).toLocaleString("en-NG")+'</option>').join("");const wanted=new URLSearchParams(location.search).get("order");if(wanted&&orders.some(x=>x.id===wanted))$("order").value=wanted;renderHistory(d.data||[]);await loadItems();$("status").textContent=orders.length?"Choose the order and explain the issue.":"No paid orders were found. Only paid/verified orders can be disputed."}
async function loadItems(){const id=$("order").value;items=[];$("item").innerHTML='<option value="">Whole order</option>';if(!id)return;const r=await db.from("order_items").select("id,item_title_snapshot,seller_user_id").eq("order_id",id);if(r.error)throw r.error;items=r.data||[];$("item").innerHTML='<option value="">Whole order</option>'+items.map(x=>'<option value="'+x.id+'">'+esc(x.item_title_snapshot)+'</option>').join("")}
function renderHistory(rows){$("history").innerHTML=rows.length?rows.map(x=>'<div class="case"><b>'+esc(x.reason)+'</b><div class="tag">'+esc(x.status.replace(/_/g," "))+'</div><small>'+new Date(x.created_at).toLocaleString()+'</small>'+(x.admin_note?'<p>Support update: '+esc(x.admin_note)+'</p>':'')+(x.resolution?'<p>Resolution: '+esc(x.resolution)+'</p>':'')+'</div>').join(""):'No dispute cases yet.'}
$("order").addEventListener("change",()=>loadItems().catch(e=>$("status").textContent=e.message));$("form").addEventListener("submit",async e=>{e.preventDefault();const orderId=$("order").value,itemId=$("item").value||null,selected=items.find(x=>x.id===itemId);if(!orderId){$("status").textContent="Choose an order first.";return}const payload={order_id:orderId,order_item_id:itemId,opened_by:user.id,against_user_id:selected?.seller_user_id||null,reason:$("reason").value,details:$("details").value.trim()};$("submit").disabled=true;const r=await db.from("order_disputes").insert(payload);$("submit").disabled=false;if(r.error){$("status").textContent=r.error.message;return}$("status").textContent="Your dispute has been submitted. You can follow updates below."; $("details").value="";$("reason").value="";await init()});
init().catch(e=>$("status").textContent=e.message||"Could not load your order information.");
})();
</script></body></html>
