<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Working Tools | DelightVendorEdit</title><link rel="icon" href="assets/dv-logo.png"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{color-scheme:dark;--g:#e9bd53}*{box-sizing:border-box}body{margin:0;background:#090909;color:#f7f4ec;font:15px system-ui;padding:20px}.wrap{max-width:1050px;margin:auto}a{color:var(--g)}header{display:flex;align-items:center;gap:12px;border-bottom:1px solid #292929;padding-bottom:15px}header img{width:36px}h1{font-size:clamp(28px,5vw,42px)}.muted{color:#aaa}.status,.card{background:#141414;border:1px solid #303030;border-radius:14px;padding:15px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:stretch}.card{min-width:0;overflow:hidden}.tool-image{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;border-radius:10px;background:#222;margin-bottom:12px}.tool-image-fallback{width:100%;aspect-ratio:4/3;display:grid;place-items:center;border-radius:10px;background:#222;color:#aaa;margin-bottom:12px;font-size:12px}.tool-name{display:block;line-height:1.3;min-height:2.6em;font-size:14px}.price{color:var(--g);font-size:22px;font-weight:800}.search-wrap{margin:16px 0}.search-input{width:100%;padding:14px 15px;border-radius:11px;border:1px solid #393939;background:#151515;color:#fff;font:inherit;outline:none}.search-input:focus{border-color:var(--g)}.modal-backdrop{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:20px;z-index:50}.modal-backdrop.show{display:flex}.modal{width:min(100%,420px);background:#171717;border:1px solid #454545;border-radius:18px;padding:22px;box-shadow:0 18px 70px #000a}.modal h2{margin:0 0 10px;font-size:21px}.modal p{color:#ccc;line-height:1.5}.modal-actions{display:flex;gap:10px;margin-top:20px}.modal-actions button{flex:1;border:0;border-radius:10px;padding:12px;font-weight:800;font-size:14px}.btn-secondary{background:#303030;color:#fff}.btn-primary{background:var(--g);color:#171208}.empty-state{grid-column:1/-1;text-align:center;padding:25px;color:#aaa}@media(max-width:340px){body{padding:12px}.grid{gap:8px}.card{padding:10px}.tool-name{font-size:12px}.price{font-size:18px}}</style></head><body><main class="wrap"><header><img src="assets/dv-logo.png" alt="DV"><b>DelightVendorEdit</b><a style="margin-left:auto" href="dashboard.html">Dashboard</a></header><h1>Working Tools</h1><p class="muted">Available tools and customer pricing.</p><div id="status" class="status">Loading…</div><div class="search-wrap"><input id="toolSearch" class="search-input" type="search" placeholder="Search working tools…" autocomplete="off" aria-label="Search working tools"></div><div id="tools" class="grid"></div><div id="modalBackdrop" class="modal-backdrop" role="dialog" aria-modal="true"><section class="modal"><h2 id="modalTitle">Confirm purchase</h2><p id="modalMessage"></p><div class="modal-actions" id="modalActions"></div></section></div></main><script>
const SUPABASE_URL="https://genlmqzkjouinofkitqt.supabase.co",KEY="sb_publishable_8uj618f_n35zeF3Fcyt5VA_xLHHOkNv";
const money=n=>"₦"+Number(n||0).toLocaleString("en-NG",{maximumFractionDigits:2});
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const backdrop=document.getElementById("modalBackdrop"),modalTitle=document.getElementById("modalTitle"),modalMessage=document.getElementById("modalMessage"),modalActions=document.getElementById("modalActions");
function showModal(title,message,actions){modalTitle.textContent=title;modalMessage.textContent=message;modalActions.innerHTML="";actions.forEach(a=>{const b=document.createElement("button");b.textContent=a.label;b.className=a.primary?"btn-primary":"btn-secondary";b.onclick=()=>{backdrop.classList.remove("show");if(a.onClick)a.onClick()};modalActions.appendChild(b)});backdrop.classList.add("show")}
function notice(title,message){showModal(title,message,[{label:"Okay",primary:true}])}
let toolsList=[];
function renderTools(){const q=document.getElementById("toolSearch").value.trim().toLowerCase();const filtered=toolsList.map((x,i)=>({...x,_index:i})).filter(x=>String(x.tool_name).toLowerCase().includes(q));document.getElementById("tools").innerHTML=filtered.map(x=>'<article class="card">'+(x.image_url?'<img class="tool-image" src="'+esc(x.image_url)+'" alt="'+esc(x.tool_name)+'" loading="lazy" onerror="this.outerHTML=\'<div class=&quot;tool-image-fallback&quot;>Image unavailable</div>\'">':'<div class="tool-image-fallback">Image unavailable</div>')+'<b class="tool-name">'+esc(x.tool_name)+'</b><div class="price">'+(x.customer_price==null?"Price unavailable":money(x.customer_price))+'</div><small class="muted">Price</small><p><button data-tool-index="'+x._index+'" '+(x.customer_price==null?"disabled":"")+' style="width:100%;margin-top:12px;background:#e9bd53;color:#171208;border:0;border-radius:9px;padding:10px 8px;font-weight:800">Purchase</button></p></article>').join("")||'<div class="empty-state">No tools match your search.</div>';document.querySelectorAll("[data-tool-index]").forEach(btn=>btn.addEventListener("click",()=>beginPurchase(Number(btn.dataset.toolIndex),btn)))}
async function beginPurchase(index,btn){const x=toolsList[index];showModal("Confirm purchase","Purchase "+x.tool_name+" for "+money(x.customer_price)+" from your shopping wallet?",[{label:"Cancel"},{label:"Confirm purchase",primary:true,onClick:()=>purchase(x,btn)}])}
async function functionErrorMessage(error){const fallback=error?.message||"Please try again.";try{const ctx=error?.context;if(ctx&&typeof ctx.clone==="function"){const response=ctx.clone();let body;try{body=await response.json()}catch{body=null}if(body&&typeof body==="object"&&(body.error||body.message))return String(body.error||body.message);if(body&&typeof body==="object"&&body.msg)return String(body.msg)}if(ctx&&typeof ctx==="object"&&!(ctx instanceof Response)){if(ctx.error||ctx.message)return String(ctx.error||ctx.message)}}catch{}return fallback}
async function purchase(x,btn){btn.disabled=true;btn.textContent="Processing…";try{const {data:out,error}=await db.functions.invoke("xclusiveplugs-tools",{body:{action:"purchase",tool_id:x.tool_id,idempotency_key:crypto.randomUUID()}});if(error){const message=await functionErrorMessage(error);notice("Purchase not completed",message);btn.disabled=false;btn.textContent="Purchase";return}if(out?.error){notice("Purchase not completed",out.error);btn.disabled=false;btn.textContent="Purchase";return}notice("Purchase successful","Your purchase was submitted successfully. Reference: "+(out.reference||"saved"));btn.textContent="Purchased"}catch(e){notice("Purchase not completed",await functionErrorMessage(e));btn.disabled=false;btn.textContent="Purchase"}}
let db;
(async()=>{try{db=supabase.createClient(SUPABASE_URL,KEY);const {data:{session}}=await db.auth.getSession();if(!session){location.href="login.html";return}const {data,error}=await db.functions.invoke("xclusiveplugs-tools",{body:{action:"catalog"}});if(error)throw error;if(data.error)throw Error(data.error);toolsList=data.tools||[];renderTools();document.getElementById("toolSearch").addEventListener("input",renderTools);document.getElementById("status").textContent=toolsList.length+" tools available."}catch(e){document.getElementById("status").textContent=e.message||"Unable to load tools."}})();
</script></body></html>
