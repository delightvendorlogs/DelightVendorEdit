<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Working Tools | DelightVendorEdit</title><link rel="icon" href="assets/dv-logo.png"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{color-scheme:dark;--g:#e9bd53}*{box-sizing:border-box}body{margin:0;background:#090909;color:#f7f4ec;font:15px system-ui;padding:20px}.wrap{max-width:1050px;margin:auto}a{color:var(--g)}header{display:flex;align-items:center;gap:12px;border-bottom:1px solid #292929;padding-bottom:15px}header img{width:36px}h1{font-size:clamp(28px,5vw,42px)}.muted{color:#aaa}.status,.card{background:#141414;border:1px solid #303030;border-radius:14px;padding:15px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:stretch}.card{min-width:0;overflow:hidden}.tool-image{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;border-radius:10px;background:#222;margin-bottom:12px}.tool-image-fallback{width:100%;aspect-ratio:4/3;display:grid;place-items:center;border-radius:10px;background:#222;color:#aaa;margin-bottom:12px;font-size:12px}.tool-name{display:block;line-height:1.3;min-height:2.6em;font-size:14px}.price{color:var(--g);font-size:22px;font-weight:800}</style></head><body><main class="wrap"><header><img src="assets/dv-logo.png" alt="DV"><b>DelightVendorEdit</b><a style="margin-left:auto" href="dashboard.html">Dashboard</a></header><h1>Working Tools</h1><p class="muted">Available tools and customer pricing.</p><div id="status" class="status">Loading…</div><div id="tools" class="grid"></div></main><script>const SUPABASE_URL="https://genlmqzkjouinofkitqt.supabase.co",KEY="sb_publishable_8uj618f_n35zeF3Fcyt5VA_xLHHOkNv";const money=n=>"₦"+Number(n||0).toLocaleString("en-NG",{maximumFractionDigits:2});(async()=>{try{const db=supabase.createClient(SUPABASE_URL,KEY);const {data:{session}}=await db.auth.getSession();if(!session){location.href="login.html";return}const {data,error}=await db.functions.invoke("xclusiveplugs-tools",{body:{action:"catalog"}});if(error)throw error;if(data.error)throw Error(data.error);const list=data.tools||[];document.getElementById("tools").innerHTML=list.map((x,i)=>'<article class="card">'+(x.image_url?'<img class="tool-image" src="'+String(x.image_url).replace(/"/g,"%22")+'" alt="Tool image" loading="lazy" onerror="this.style.display=&quot;none&quot;">':'<div class="tool-image-fallback">Image unavailable</div>')+'<b class="tool-name">'+String(x.tool_name).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))+'</b><p class="muted">Provider: '+(x.provider_price==null?"Unavailable":money(x.provider_price))+'</p><div class="price">'+(x.customer_price==null?"Price unavailable":money(x.customer_price))+'</div><small class="muted">Customer price</small><p><button data-tool-index="'+i+'" '+(x.customer_price==null?"disabled":"")+' style="margin-top:12px;background:#e9bd53;color:#171208;border:0;border-radius:9px;padding:10px 14px;font-weight:800">Purchase</button></p></article>').join("")||"No active tools.";document.querySelectorAll("[data-tool-index]").forEach(btn=>btn.addEventListener("click",async()=>{const x=list[Number(btn.dataset.toolIndex)];if(!confirm("Purchase "+x.tool_name+" for "+money(x.customer_price)+" from your shopping wallet?"))return;btn.disabled=true;btn.textContent="Processing…";try{const {data:out,error:purchaseError}=await db.functions.invoke("xclusiveplugs-tools",{body:{action:"purchase",tool_id:x.tool_id,idempotency_key:crypto.randomUUID()}});if(purchaseError)throw purchaseError;if(out?.error)throw Error(out.error);alert("Purchase submitted successfully. Reference: "+(out.reference||"saved"));btn.textContent="Purchased"}catch(e){alert(e.message||"Purchase could not be completed.");btn.disabled=false;btn.textContent="Purchase"}}));document.getElementById("status").textContent=list.length+" tools loaded.";}catch(e){document.getElementById("status").textContent=e.message||"Unable to load tools."}})();</script></body></html>
