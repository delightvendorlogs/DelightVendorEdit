<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Working Tools | DelightVendorEdit</title><link rel="icon" href="assets/dv-logo.png"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{color-scheme:dark;--g:#e9bd53}*{box-sizing:border-box}body{margin:0;background:#090909;color:#f7f4ec;font:15px system-ui;padding:20px}.wrap{max-width:1050px;margin:auto}a{color:var(--g)}header{display:flex;align-items:center;gap:12px;border-bottom:1px solid #292929;padding-bottom:15px}header img{width:36px}h1{font-size:clamp(28px,5vw,42px)}.muted{color:#aaa}.status,.card{background:#141414;border:1px solid #303030;border-radius:14px;padding:15px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:stretch}.card{min-width:0;overflow:hidden}.tool-image{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;border-radius:10px;background:#222;margin-bottom:12px}.tool-image-fallback{width:100%;aspect-ratio:4/3;display:grid;place-items:center;border-radius:10px;background:#222;color:#aaa;margin-bottom:12px;font-size:12px}.tool-name{display:block;line-height:1.3;min-height:2.6em;font-size:14px}.price{color:var(--g);font-size:22px;font-weight:800}.search-wrap{margin:16px 0}.search-input{width:100%;padding:14px 15px;border-radius:11px;border:1px solid #393939;background:#151515;color:#fff;font:inherit;outline:none}.search-input:focus{border-color:var(--g)}.modal-backdrop{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:20px;z-index:50}.modal-backdrop.show{display:flex}.modal{width:min(100%,420px);background:#171717;border:1px solid #454545;border-radius:18px;padding:22px;box-shadow:0 18px 70px #000a}.modal h2{margin:0 0 10px;font-size:21px}.modal p{color:#ccc;line-height:1.5}.modal-actions{display:flex;gap:10px;margin-top:20px}.modal-actions button{flex:1;border:0;border-radius:10px;padding:12px;font-weight:800;font-size:14px}.btn-secondary{background:#303030;color:#fff}.btn-primary{background:var(--g);color:#171208}.empty-state{grid-column:1/-1;text-align:center;padding:25px;color:#aaa}@media(max-width:340px){body{padding:12px}.grid{gap:8px}.card{padding:10px}.tool-name{font-size:12px}.price{font-size:18px}} .tool-video{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;border-radius:10px;background:#050505;margin-bottom:12px}.media-actions{display:flex;gap:8px;margin:-2px 0 12px}.media-actions button{flex:1;background:#252525;color:var(--g);border:1px solid #51452a;border-radius:9px;padding:9px;font-weight:800}.admin-stock{font-size:12px;color:#aaa;margin-top:5px}.admin-desc{color:#c8c3b8;font-size:13px;line-height:1.5;white-space:pre-wrap;margin:9px 0}.viewer{position:fixed;inset:0;background:#000e;z-index:90;display:none;align-items:center;justify-content:center;padding:14px}.viewer.show{display:flex}.viewer-panel{width:min(100%,980px);max-height:94vh;overflow:auto;background:#111;border:1px solid #50452b;border-radius:16px;padding:12px}.viewer-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.viewer-top button{background:#333;color:#fff;border:0;border-radius:8px;padding:9px 13px}.viewer-media{display:block;max-width:100%;max-height:78vh;width:auto;height:auto;margin:auto;object-fit:contain}.viewer-video{width:100%;max-height:78vh;background:#000}.card .tool-video{aspect-ratio:4/3}@media(max-width:340px){.media-actions{flex-direction:column}}.media-tap{position:relative;display:block;width:100%;padding:0;border:0;border-radius:12px;overflow:hidden;background:#050505;cursor:zoom-in;color:#fff;text-align:center}.media-tap::after{content:"Tap to view";position:absolute;left:8%;right:8%;bottom:12px;padding:9px 12px;border-radius:999px;background:#000b;color:#fff;font-weight:800;pointer-events:none}.media-actions{display:none!important}

/* Video review: immersive viewport like the Logs experience. Image review keeps its existing modal. */
#mediaViewer.video-viewer{padding:0!important;align-items:stretch!important;justify-content:stretch!important;background:#050505!important;overflow:hidden!important}
#mediaViewer.video-viewer .viewer-panel{position:relative!important;width:100vw!important;height:100vh!important;height:100dvh!important;max-height:none!important;max-width:none!important;overflow:hidden!important;margin:0!important;padding:0!important;border:0!important;border-radius:0!important;background:#050505!important;box-shadow:none!important;display:flex!important;flex-direction:column!important;justify-content:center!important}
#mediaViewer.video-viewer .viewer-top{position:absolute!important;z-index:2!important;top:env(safe-area-inset-top,0px)!important;left:0!important;right:0!important;margin:0!important;padding:12px 14px!important;background:linear-gradient(#000b,transparent)!important;min-height:58px!important}
#mediaViewer.video-viewer .viewer-top strong{color:#fff!important;text-shadow:0 1px 5px #000!important}
#mediaViewer.video-viewer .viewer-top button{background:#242424dd!important;border:1px solid #ffffff35!important;color:#fff!important}
#mediaViewer.video-viewer #viewerBody{width:100%!important;height:100%!important;display:flex!important;align-items:center!important;justify-content:center!important;overflow:hidden!important}
#mediaViewer.video-viewer .viewer-video{display:block!important;width:100%!important;height:100%!important;max-width:100vw!important;max-height:100vh!important;max-height:100dvh!important;object-fit:contain!important;margin:0!important;background:#050505!important;border-radius:0!important}
@media(orientation:landscape){#mediaViewer.video-viewer .viewer-video{width:100vw!important;height:100dvh!important}}

</style></head><body><main class="wrap"><header><img src="assets/dv-logo.png" alt="DV"><b>DelightVendorEdit</b><a style="margin-left:auto" href="dashboard.html">Dashboard</a></header><h1>Working Tools</h1><p class="muted">Available tools and customer pricing.</p><div id="status" class="status">Loading…</div><div class="search-wrap"><input id="toolSearch" class="search-input" type="search" placeholder="Search working tools…" autocomplete="off" aria-label="Search working tools"></div><div id="tools" class="grid"></div><div id="modalBackdrop" class="modal-backdrop" role="dialog" aria-modal="true"><section class="modal"><h2 id="modalTitle">Confirm purchase</h2><p id="modalMessage"></p><div class="modal-actions" id="modalActions"></div></section></div><div id="mediaViewer" class="viewer" role="dialog" aria-modal="true" aria-label="Working Tool media"><section class="viewer-panel"><div class="viewer-top"><strong id="viewerTitle">Working Tool</strong><button type="button" id="viewerClose">Close ✕</button></div><div id="viewerBody"></div></section></div></main><script>
const SUPABASE_URL="https://genlmqzkjouinofkitqt.supabase.co",KEY="sb_publishable_8uj618f_n35zeF3Fcyt5VA_xLHHOkNv";
const money=n=>"₦"+Number(n||0).toLocaleString("en-NG",{maximumFractionDigits:2});
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function cleanDelivery(value){if(value===null||value===undefined||value==="")return "";if(typeof value==="string"){const raw=value.trim();if(!raw)return "";try{return cleanDelivery(JSON.parse(raw))}catch{return raw}}if(Array.isArray(value))return value.map(cleanDelivery).filter(Boolean).join("\n\n");if(typeof value!=="object")return String(value);const hidden=new Set(["provider","provider_name","provider_order_id","provider_reference","provider_order","source","vendor","service_provider","provider_label","provider_code","api_provider","raw_response","idempotency_key","tool_id","order_id","reference","created_at","updated_at"]);const preferred=["credentials","credential","delivery_info","delivery","content","license","account","details","result","data"];for(const key of preferred){if(value[key]!==undefined&&value[key]!==null&&value[key]!==""){const text=cleanDelivery(value[key]);if(text)return text}}return Object.entries(value).filter(([key,val])=>!hidden.has(key.toLowerCase())&&val!==null&&val!=="").map(([key,val])=>{const label=key.replace(/_/g," ").replace(/\b\w/g,ch=>ch.toUpperCase());const text=typeof val==="object"?cleanDelivery(val):String(val);return text?label+": "+text:""}).filter(Boolean).join("\n")};
const backdrop=document.getElementById("modalBackdrop"),modalTitle=document.getElementById("modalTitle"),modalMessage=document.getElementById("modalMessage"),modalActions=document.getElementById("modalActions");
function showModal(title,message,actions){modalTitle.textContent=title;modalMessage.textContent=message;modalMessage.style.whiteSpace="pre-wrap";modalMessage.style.overflowWrap="anywhere";modalActions.innerHTML="";actions.forEach(a=>{const b=document.createElement("button");b.textContent=a.label;b.className=a.primary?"btn-primary":"btn-secondary";b.onclick=()=>{backdrop.classList.remove("show");if(a.onClick)a.onClick()};modalActions.appendChild(b)});backdrop.classList.add("show")}
function notice(title,message){showModal(title,message,[{label:"Okay",primary:true}])}
let toolsList=[],adminToolsList=[],db;
function publicMedia(path){return path?db.storage.from("seller-product-images").getPublicUrl(path).data.publicUrl:""}
function openMedia(title,url,isVideo){if(!url)return;const viewer=document.getElementById("mediaViewer");viewer.classList.toggle("video-viewer",!!isVideo);document.getElementById("viewerTitle").textContent=title||"Working Tool";const body=document.getElementById("viewerBody");body.innerHTML="";const el=document.createElement(isVideo?"video":"img");el.className=isVideo?"viewer-media viewer-video":"viewer-media";el.src=url;if(isVideo){el.controls=true;el.autoplay=true;el.playsInline=true;el.setAttribute("controlsList","nodownload");}else{el.alt=title||"Working Tool media"}body.appendChild(el);viewer.classList.add("show");if(isVideo){document.body.style.overflow="hidden";const play=el.play();if(play&&typeof play.catch==="function")play.catch(()=>{})}}
function closeMedia(){const viewer=document.getElementById("mediaViewer");const video=document.querySelector("#viewerBody video");if(video){video.pause();video.removeAttribute("src");video.load()}viewer.classList.remove("show","video-viewer");document.getElementById("viewerBody").innerHTML="";document.body.style.overflow=""}
document.getElementById("viewerClose").addEventListener("click",closeMedia);
document.getElementById("mediaViewer").addEventListener("click",e=>{if(e.target.id==="mediaViewer")closeMedia()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeMedia()});
function renderTools(){
 const q=document.getElementById("toolSearch").value.trim().toLowerCase();
 const admin=adminToolsList.filter(x=>(String(x.title)+" "+String(x.description||"")).toLowerCase().includes(q));
 const providers=toolsList.map((x,i)=>({...x,_index:i})).filter(x=>String(x.tool_name).toLowerCase().includes(q));
 const adminHtml=admin.filter(x=>x.inventory_mode==="unlimited"||Number(x.available_inventory||0)>0).map(x=>{const video=!!x.video_path,url=publicMedia(x.video_path||x.image_path);const media=video?'<video class="tool-video" src="'+esc(url)+'" muted autoplay loop playsinline preload="metadata" aria-label="'+esc(x.title)+' video preview"></video>':'<img class="tool-image" src="'+esc(url)+'" alt="'+esc(x.title)+'" loading="lazy">';return '<article class="card admin-tool-card"><button type="button" class="media-tap" data-view-admin="'+esc(x.id)+'">'+media+'</button><b class="tool-name">'+esc(x.title)+'</b><p class="admin-desc">'+esc(x.description||"")+'</p><div class="price">'+money(x.price)+'</div><small class="muted">Price</small><p><button data-buy-admin="'+esc(x.id)+'" '+(Number(x.available_inventory||0)<1?"disabled":"")+' style="width:100%;margin-top:12px;background:#e9bd53;color:#171208;border:0;border-radius:9px;padding:10px 8px;font-weight:800">'+(Number(x.available_inventory||0)>0?"Purchase":"Add inventory first")+'</button></p></article>'}).join("");
 const providerHtml=providers.map(x=>'<article class="card">'+(x.image_url?'<button type="button" class="media-tap" data-view-provider="'+x._index+'"><img class="tool-image" src="'+esc(x.image_url)+'" alt="'+esc(x.tool_name)+'" loading="lazy"></button>':'<div class="tool-image-fallback">Image unavailable</div>')+'<b class="tool-name">'+esc(x.tool_name)+'</b><div class="price">'+(x.customer_price==null?"Price unavailable":money(x.customer_price))+'</div><small class="muted">Price</small><p><button data-tool-index="'+x._index+'" '+(x.customer_price==null?"disabled":"")+' style="width:100%;margin-top:12px;background:#e9bd53;color:#171208;border:0;border-radius:9px;padding:10px 8px;font-weight:800">Purchase</button></p></article>').join("");
 document.getElementById("tools").innerHTML=adminHtml+providerHtml||'<div class="empty-state">No tools match your search.</div>';
 document.querySelectorAll("[data-tool-index]").forEach(btn=>btn.addEventListener("click",()=>beginPurchase(Number(btn.dataset.toolIndex),btn)));
 document.querySelectorAll("[data-buy-admin]").forEach(btn=>btn.addEventListener("click",()=>beginAdminPurchase(btn.dataset.buyAdmin,btn)));
 document.querySelectorAll("[data-view-admin]").forEach(btn=>btn.addEventListener("click",()=>{const x=adminToolsList.find(v=>v.id===btn.dataset.viewAdmin);if(x)openMedia(x.title,publicMedia(x.video_path||x.image_path),!!x.video_path)}));
 document.querySelectorAll("[data-view-provider]").forEach(btn=>btn.addEventListener("click",()=>{const x=providers.find(v=>v._index===Number(btn.dataset.viewProvider));if(x)openMedia(x.tool_name,x.image_url,false)}));
 document.querySelectorAll(".admin-tool-card video").forEach(v=>{v.muted=true;v.play().catch(()=>{})});
}
async function beginPurchase(index,btn){const x=toolsList[index];showModal("Confirm purchase","Purchase "+x.tool_name+" for "+money(x.customer_price)+" from your shopping wallet?",[{label:"Cancel"},{label:"Confirm purchase",primary:true,onClick:()=>purchaseProvider(x,btn)}])}
async function functionErrorMessage(error){const fallback=error?.message||"Please try again.";try{const ctx=error?.context;if(ctx&&typeof ctx.clone==="function"){const response=ctx.clone();let body;try{body=await response.json()}catch{body=null}if(body&&typeof body==="object"&&(body.error||body.message))return String(body.error||body.message);if(body&&typeof body==="object"&&body.msg)return String(body.msg)}if(ctx&&typeof ctx==="object"&&!(ctx instanceof Response)){if(ctx.error||ctx.message)return String(ctx.error||ctx.message)}}catch{}return fallback}
async function purchaseProvider(x,btn){btn.disabled=true;btn.textContent="Processing…";try{const {data:out,error}=await db.functions.invoke("xclusiveplugs-tools",{body:{action:"purchase",tool_id:x.tool_id,idempotency_key:crypto.randomUUID()}});if(error)throw Error(await functionErrorMessage(error));if(out?.error)throw Error(out.error);const delivered=cleanDelivery(out.delivery);notice("Purchase successful",delivered?"Your Working Tool delivery:\n\n"+delivered+"\n\nReference: "+(out.reference||"saved"):"Your purchase was submitted successfully. Reference: "+(out.reference||"saved")+(out.inventory_used?"\nSaved reusable inventory was used.":""));btn.textContent="Purchased"}catch(e){notice("Purchase not completed",await functionErrorMessage(e));btn.disabled=false;btn.textContent="Purchase"}}
async function beginAdminPurchase(id,btn){const x=adminToolsList.find(v=>v.id===id);if(!x)return;const requestId=btn.dataset.requestId||(btn.dataset.requestId=crypto.randomUUID());showModal("Confirm purchase","Purchase "+x.title+" for "+money(x.price)+" from your shopping wallet?",[{label:"Cancel"},{label:"Confirm purchase",primary:true,onClick:()=>purchaseAdmin(x,btn,requestId)}])}
async function purchaseAdmin(x,btn,requestId){btn.disabled=true;btn.textContent="Processing…";try{const {data,error}=await db.rpc("purchase_admin_working_tool",{p_tool_id:x.id,p_request_id:requestId});if(error)throw error;if(!data?.ok){delete btn.dataset.requestId;throw Error(data?.reason||"Purchase could not be completed.")}delete btn.dataset.requestId;const delivery=cleanDelivery(data.delivery_info);notice("Purchase successful",(delivery?"Your Working Tool delivery:\n\n"+delivery+"\n\n":"")+"Order: "+(data.order_number||"saved")+"\nWallet transaction: completed.");await loadAdminTools();renderTools()}catch(e){notice("Purchase not completed",e.message||"Please try again.");btn.disabled=false;btn.textContent="Purchase"}}
async function loadAdminTools(){const {data,error}=await db.from("admin_working_tools").select("id,title,description,image_path,video_path,price,inventory_mode,available_inventory,created_at,display_order").eq("is_active",true).order("display_order",{ascending:true}).order("created_at",{ascending:false});if(error)throw error;adminToolsList=data||[]}
(async()=>{try{db=supabase.createClient(SUPABASE_URL,KEY);const {data:{session}}=await db.auth.getSession();if(!session){location.href="login.html";return}let providerError=null;try{const {data,error}=await db.functions.invoke("xclusiveplugs-tools",{body:{action:"catalog"}});if(error)throw Error(await functionErrorMessage(error));if(data.error)throw Error(data.error);toolsList=data.tools||[]}catch(e){providerError=e.message||"Provider catalogue is unavailable."}try{await loadAdminTools()}catch(e){if(!providerError)providerError=e.message||"Could not load admin Working Tools."}renderTools();document.getElementById("toolSearch").addEventListener("input",renderTools);const total=toolsList.length+adminToolsList.length;document.getElementById("status").textContent=total+" tools available."+(providerError&&adminToolsList.length?" Provider catalogue temporarily unavailable; your admin listings are still shown.":providerError&&!adminToolsList.length?" "+providerError:"")}catch(e){document.getElementById("status").textContent=e.message||"Unable to load tools."}})();
</script></body></html>
