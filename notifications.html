<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080808">
<meta name="description" content="Your DelightVendorEdit notifications."><title>Notifications — DelightVendorEdit</title>
<link rel="icon" type="image/png" href="assets/dv-logo.png"><link rel="apple-touch-icon" href="assets/dv-logo.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--gold:#d4af37;--muted:#b8ad8d;--line:#493b1c;--text:#f5f0df}
*{box-sizing:border-box}body{margin:0;background:#080808;color:var(--text);font-family:Arial,Helvetica,sans-serif}
:root{--gold:#d4af37;--muted:#b8ad8d;--line:#493b1c;--text:#f5f0df}
*{box-sizing:border-box}body{margin:0;background:#080808;color:var(--text);font-family:Arial,Helvetica,sans-serif}
.top{display:flex;align-items:center;gap:14px;padding:12px clamp(14px,3vw,24px);background:#0c0c0c;border-bottom:1px solid #242016}
.brand{display:flex;align-items:center;gap:9px;flex:1;min-width:0}.brand img{width:34px;height:34px;object-fit:contain}.brand strong{font-size:clamp(14px,1.8vw,18px);white-space:nowrap}
.back,.btn{border:1px solid #6d5622;background:#121212;color:var(--gold);border-radius:9px;padding:9px 12px;text-decoration:none;font-weight:700;cursor:pointer;font-size:13px}
.wrap{max-width:760px;margin:22px auto 40px;padding:0 16px}.panel{border:1px solid #342b18;background:#101010;border-radius:16px;padding:clamp(16px,3vw,24px)}
.eyebrow{color:var(--gold);font-size:11px;font-weight:800;letter-spacing:.14em;margin:0 0 12px}
h1{font-size:clamp(25px,4vw,34px);margin:0 0 10px;letter-spacing:-.02em}.muted{color:var(--muted);font-size:14px;line-height:1.55;margin:0}
.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:20px 0 16px}.filter{padding:8px 13px;border:1px solid #302817;border-radius:20px;background:#080808;color:#e0d5b5;font-weight:700;font-size:12px;cursor:pointer}.filter.active{background:var(--gold);color:#111;border-color:var(--gold)}
.btn{font-size:12px;padding:9px 13px}.btn:disabled{opacity:.5;cursor:not-allowed}.notice{display:none;padding:10px 12px;border-radius:8px;font-size:12px;line-height:1.5;margin:10px 0}.notice.show{display:block}.notice.error{background:#2b1414;border:1px solid #703737;color:#ffbcbc}.notice.ok{background:#102419;border:1px solid #28623e;color:#b1f0c2}.notice.info{background:#211d10;border:1px solid #665323;color:#f1d77a}
.list{display:grid;gap:9px}.item{display:flex;align-items:flex-start;gap:10px;padding:12px;border:1px solid #302817;border-radius:12px;background:#111;cursor:pointer;text-align:left;color:inherit;width:100%;min-width:0}.item.unread{border-color:#80651f;background:linear-gradient(100deg,#1a160c,#111)}.dot{flex:0 0 9px;width:9px;height:9px;border-radius:50%;background:#514a37;margin-top:5px}.item.unread .dot{background:var(--gold)}.item-main{min-width:0;flex:1}.item h2{font-size:14px;margin:0 0 5px;color:#f5df8d;line-height:1.35}.item p{font-size:13px;line-height:1.5;margin:0;color:#c6bea9;white-space:pre-wrap;overflow-wrap:anywhere}.meta{display:block;font-size:10px;color:#95896c;margin-top:7px}.thumb{width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid #493b1c;flex:0 0 56px}.empty{padding:22px 12px;text-align:center;border:1px dashed #493b1c;border-radius:10px;color:var(--muted);font-size:13px;line-height:1.6}
.modal{display:none;position:fixed;inset:0;z-index:1000;background:#000b;align-items:center;justify-content:center;padding:16px}.modal.open{display:flex}.detail{width:min(620px,100%);max-height:88dvh;overflow:auto;background:#101010;border:1px solid #493b1c;border-radius:16px;padding:clamp(16px,3vw,24px);padding-bottom:max(18px,env(safe-area-inset-bottom));box-shadow:0 18px 60px #0009}.detail-top{display:flex;gap:10px;align-items:flex-start}.detail-top h2{color:#f5df8d;margin:0;flex:1;overflow-wrap:anywhere;font-size:clamp(18px,3vw,24px)}.close{background:#211d10;border:1px solid #665323;color:var(--gold);border-radius:8px;font-size:20px;width:34px;height:34px;cursor:pointer;flex:0 0 34px}.detail-message{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65;color:#eee5cd;font-size:14px;margin:16px 0}.detail-message a,.detail-message a:visited{color:#36a5ff;text-decoration:underline;text-underline-offset:3px;font-weight:700}.detail-message a:hover{color:#75c1ff}.detail-message a{cursor:pointer;pointer-events:auto;display:inline-block;position:relative;z-index:2}.detail-image{display:block;width:auto;max-width:100%;max-height:48vh;object-fit:contain;border-radius:9px;margin:14px auto}.detail-image[hidden]{display:none!important}.detail-date{font-size:11px;color:var(--muted);margin-top:7px}
@media(max-width:520px){.top{padding:10px 12px;gap:10px}.back{padding:8px 10px;font-size:12px}.brand{gap:7px}.brand img{width:30px;height:30px}.brand strong{font-size:13px}.wrap{padding:0 10px;margin:14px auto 28px}.panel{padding:15px;border-radius:13px}.actions{gap:6px;margin:16px 0 12px}.filter{padding:8px 11px;font-size:11px}.btn{font-size:11px;padding:8px 10px}.item{padding:11px;border-radius:10px;gap:8px}.thumb{width:48px;height:48px;flex-basis:48px}.detail{border-radius:13px;padding:16px;max-height:90dvh}.detail-message{font-size:14px;margin:14px 0}}
@media(max-width:360px){.brand strong{font-size:12px}.brand img{width:27px;height:27px}.back{font-size:11px;padding:7px 8px}.panel{padding:12px}.item{padding:9px}.thumb{width:42px;height:42px;flex-basis:42px}}
 .detail-message a{color:#4da3ff;text-decoration:underline;font-weight:800} </style>
</head>
<body>
<header class="top"><a class="back" href="dashboard.html">← Back</a><div class="brand"><img src="assets/dv-logo.png" alt="DV logo"><strong>DelightVendorEdit</strong></div></header>
<main class="wrap"><section class="panel"><p class="eyebrow">YOUR ACCOUNT</p><h1>Notifications</h1>
<p class="muted">Updates sent to you by DelightVendorEdit. Tap any notification to read the full message.</p>
<div id="notice" class="notice" role="status" aria-live="polite"></div>
<div class="actions"><button class="filter active" data-filter="all" type="button">All</button><button class="filter" data-filter="unread" type="button">Unread</button><button class="filter" data-filter="read" type="button">Read</button><button class="btn" id="markAll" type="button">Mark all as read</button></div>
<div id="notificationList" class="list"><div class="empty">Loading your notifications…</div></div></section></main>
<div id="detailModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="detailTitle"><article class="detail"><div class="detail-top"><h2 id="detailTitle">Notification</h2><button class="close" id="closeDetail" type="button" aria-label="Close">×</button></div><div id="detailDate" class="detail-date"></div><div id="detailMessage" class="detail-message"></div><img id="detailImage" class="detail-image" alt="Image attached to this notification" hidden><div class="actions"><button class="btn" id="detailDone" type="button">Done</button></div></article></div>
<script>
(()=>{"use strict";
const URL="https://genlmqzkjouinofkitqt.supabase.co",KEY="sb_publishable_8uj618f_n35zeF3Fcyt5VA_xLHHOkNv",db=window.supabase.createClient(URL,KEY),$=id=>document.getElementById(id);
let userId=null,items=[],filter="all",channel=null,busy=false;
function say(msg,type="info"){const e=$("notice");e.textContent=msg;e.className="notice show "+type}
function renderMessageLinks(target,message){
 target.replaceChildren();
 const text=String(message||"");
 const re=/https:\/\/[^\s<>"']+/gi;
 let pos=0,m;
 while((m=re.exec(text))){
  let raw=m[0],url=raw;
  while(/[.,!?;:)}\]]$/.test(url))url=url.slice(0,-1);
  if(m.index>pos)target.append(document.createTextNode(text.slice(pos,m.index)));
  try{
   const parsed=new URL(url);
   if(parsed.protocol==="https:"&&parsed.hostname){
    const a=document.createElement("a");
    a.href=parsed.href;
    a.textContent="click here";
    a.target="_blank";
    a.rel="noopener noreferrer";
    target.append(a);
    if(raw.length>url.length)target.append(document.createTextNode(raw.slice(url.length)));
   }else target.append(document.createTextNode(raw));
  }catch{target.append(document.createTextNode(raw))}
  pos=m.index+raw.length;
 }
 if(pos<text.length)target.append(document.createTextNode(text.slice(pos)));
}
function date(v){const d=new Date(v);return Number.isNaN(d.getTime())?"Date unavailable":d.toLocaleString()}
async function load(show=true){if(!userId)return;if(show)$("notificationList").innerHTML='<div class="empty">Loading notifications…</div>';
const {data,error}=await db.from("notifications").select("id,recipient_user_id,title,message,category,is_read,read_at,created_at,image_url").eq("recipient_user_id",userId).order("created_at",{ascending:false}).limit(500);
if(error){console.error(error);say("Could not load notifications. Please refresh and try again.","error");$("notificationList").innerHTML='<div class="empty">Could not load notifications.</div>';return}
items=data||[];render()}
function render(){const visible=items.filter(n=>filter==="unread"?!n.is_read:filter==="read"?n.is_read:true),list=$("notificationList");list.replaceChildren();
if(!visible.length){const e=document.createElement("div");e.className="empty";e.textContent=filter==="unread"?"You have no unread notifications.":filter==="read"?"You have no read notifications yet.":"Notifications sent to you will appear here.";list.append(e)}
visible.forEach(n=>{const b=document.createElement("button");b.type="button";b.className="item "+(n.is_read?"read":"unread");
const dot=document.createElement("span");dot.className="dot";dot.setAttribute("aria-hidden","true");
const main=document.createElement("span");main.className="item-main";const h=document.createElement("h2");h.textContent=n.title||"Notification";
const p=document.createElement("p");const msg=String(n.message||"");const preview=msg.replace(/https:\/\/[^\s<>"\']+/gi,"click here");p.textContent=preview.length>150?preview.slice(0,150).trimEnd()+"…":preview;
const meta=document.createElement("span");meta.className="meta";meta.textContent=date(n.created_at)+" · "+(n.is_read?"Read":"Unread");main.append(h,p,meta);b.append(dot,main);
if(n.image_url){const im=document.createElement("img");im.className="thumb";im.src=n.image_url;im.alt="";im.loading="lazy";im.addEventListener("error",()=>im.remove());b.append(im)}
b.addEventListener("click",()=>openDetail(n.id));list.append(b)});
const unread=items.filter(n=>!n.is_read).length;$("markAll").disabled=busy||unread===0}
async function openDetail(id){const n=items.find(x=>String(x.id)===String(id));if(!n)return;
$("detailTitle").textContent=n.title||"Notification";$("detailDate").textContent=date(n.created_at);renderMessageLinks($("detailMessage"),n.message||"");
const im=$("detailImage");if(n.image_url){im.src=n.image_url;im.hidden=false}else{im.removeAttribute("src");im.hidden=true}
$("detailModal").classList.add("open");
if(!n.is_read){const {error}=await db.from("notifications").update({is_read:true,read_at:new Date().toISOString()}).eq("id",n.id).eq("recipient_user_id",userId);if(error){say("Notification opened, but read status could not be updated.","error");return}n.is_read=true;n.read_at=new Date().toISOString();render()}}
function closeDetail(){$("detailModal").classList.remove("open")}
$("closeDetail").onclick=closeDetail;$("detailDone").onclick=closeDetail;$("detailModal").addEventListener("click",e=>{if(e.target===$("detailModal"))closeDetail()});document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDetail()});
document.querySelectorAll("[data-filter]").forEach(b=>b.addEventListener("click",()=>{filter=b.dataset.filter;document.querySelectorAll("[data-filter]").forEach(x=>x.classList.toggle("active",x===b));render()}));
$("markAll").onclick=async()=>{if(busy||!items.some(n=>!n.is_read))return;busy=true;$("markAll").disabled=true;const {error}=await db.from("notifications").update({is_read:true,read_at:new Date().toISOString()}).eq("recipient_user_id",userId).eq("is_read",false);busy=false;if(error){say("Could not mark all notifications as read.","error");render();return}items.forEach(n=>{if(!n.is_read){n.is_read=true;n.read_at=new Date().toISOString()}});render();say("All notifications marked as read.","ok")};
async function init(){const {data,error}=await db.auth.getUser();if(error||!data?.user){location.replace("login.html");return}userId=data.user.id;await load();channel=db.channel("dve-notifications-"+userId).on("postgres_changes",{event:"*",schema:"public",table:"notifications",filter:"recipient_user_id=eq."+userId},()=>load(false)).subscribe()}
window.addEventListener("beforeunload",()=>{if(channel)db.removeChannel(channel)});init();
})();
</script>
</body></html>
