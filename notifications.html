<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080808">
<meta name="description" content="View and manage your DelightVendorEdit notifications.">
<title>Notifications — DelightVendorEdit</title>
<link rel="icon" type="image/png" href="assets/dv-logo.png">
<link rel="apple-touch-icon" href="assets/dv-logo.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{color-scheme:dark;--bg:#080808;--panel:#121212;--panel2:#191919;--gold:#e7b84b;--gold2:#f5d47e;--text:#f5f3ed;--muted:#a6a39b;--line:#303030;--red:#ff9292}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#211b0c,transparent 48%),var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}button{font:inherit;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}a{color:inherit;text-decoration:none}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px clamp(13px,4vw,42px);border-bottom:1px solid var(--line);background:#0c0c0c}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:clamp(15px,2.6vw,21px)}.brand img{width:39px;height:39px;object-fit:contain}
main{width:min(900px,94%);margin:28px auto 50px}.heading{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}h1{font-size:clamp(25px,5vw,35px);margin:0 0 8px}.muted{color:var(--muted);font-size:13px;line-height:1.6;margin:0}
.count{white-space:nowrap;border:1px solid #5b481d;background:#211b0e;color:var(--gold2);padding:8px 11px;border-radius:30px;font-size:12px;font-weight:800}
.toolbar,.filters{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0 14px}.btn,.filter{border:1px solid #393939;border-radius:10px;padding:10px 13px;background:var(--panel2);color:var(--text);font-size:12px;font-weight:700}.primary{background:var(--gold);color:#171107;border-color:var(--gold)}.danger{color:#ffb1b1;border-color:#643131;background:#251313}.filter{border-radius:30px;color:#c9c9c9}.filter.active{color:var(--gold2);border-color:#70551b;background:#211b0e}
.status{min-height:20px;color:var(--muted);font-size:12px;margin:12px 0}.status.error{color:var(--red)}.status.success{color:#8ce5a8}
.list{display:grid;gap:12px}.item{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:13px;padding:18px;background:var(--panel);border:1px solid var(--line);border-radius:15px}.item.unread{border-color:#5b481d;background:linear-gradient(110deg,#19160e,#111)}.item-icon{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:#211b0e;color:var(--gold2);font-size:20px}.content{min-width:0}.item h2{font-size:15px;line-height:1.5;margin:0 0 7px;overflow-wrap:anywhere}.item p{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7;font-size:13px;color:#c8c8c8;margin:0 0 10px}.item time{font-size:11px;color:#888}.item-image{display:block;max-width:min(100%,420px);max-height:320px;object-fit:contain;border-radius:10px;border:1px solid var(--line);margin:10px 0}.actions{display:flex;flex-direction:column;gap:7px}.small{padding:7px 9px;border:1px solid #383838;border-radius:8px;background:#191919;color:#ddd;font-size:11px;white-space:nowrap}.empty{padding:45px 20px;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:15px;color:var(--muted)}footer{text-align:center;color:#777;font-size:12px;padding:22px}
@media(max-width:600px){header{padding:12px}.brand img{width:34px;height:34px}main{margin-top:22px}.item{grid-template-columns:36px minmax(0,1fr);gap:10px;padding:14px}.item-icon{width:36px;height:36px}.actions{grid-column:2;flex-direction:row;flex-wrap:wrap}.toolbar .btn{flex:1}.heading{gap:8px}}
</style>
</head>
<body>
<header>
<a class="brand" href="dashboard.html"><img src="assets/dv-logo.png" alt="DV logo"><span>DelightVendorEdit</span></a>
<a href="dashboard.html" style="color:var(--gold2);font-size:12px;font-weight:700">← Dashboard</a>
</header>
<main>
<div class="heading"><div><h1>Notifications</h1><p class="muted">Messages and updates sent to your account.</p></div><span class="count" id="unreadCount">0 unread</span></div>
<div class="toolbar"><button class="btn primary" id="markAll" type="button">Mark all as read</button><button class="btn danger" id="clearRead" type="button">Clear read</button><button class="btn" id="refresh" type="button">Refresh</button></div>
<div class="filters" role="group" aria-label="Notification filter"><button class="filter active" data-filter="all" type="button">All notifications</button><button class="filter" data-filter="unread" type="button">Unread</button><button class="filter" data-filter="read" type="button">Read</button></div>
<div id="status" class="status" role="status" aria-live="polite">Checking your session…</div><div id="notificationList" class="list"><div class="empty">Loading notifications…</div></div>
</main>
<footer>© <span id="year"></span> DelightVendorEdit</footer>
<script>
(() => {
"use strict";
const URL="https://genlmqzkjouinofkitqt.supabase.co";
const KEY="sb_publishable_8uj618f_n35zeF3Fcyt5VA_xLHHOkNv";
const db=window.supabase.createClient(URL,KEY);
const $=id=>document.getElementById(id);
let userId=null,items=[],filter="all",channel=null,busy=false;
$("year").textContent=new Date().getFullYear();
function status(text,type=""){ $("status").textContent=text;$("status").className="status"+(type?" "+type:"");}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function date(v){const d=new Date(v);return Number.isNaN(d.getTime())?"Date unavailable":d.toLocaleString();}
function setBusy(v){busy=v;["markAll","clearRead","refresh"].forEach(id=>$(id).disabled=v);}
async function load(show=true){
 if(!userId)return;if(show)status("Loading notifications…");
 const {data,error}=await db.from("notifications").select("id,recipient_user_id,title,message,category,is_read,read_at,created_at,image_url").eq("recipient_user_id",userId).order("created_at",{ascending:false}).limit(500);
 if(error){console.error(error);status("Could not load notifications. Please refresh and try again.","error");return;}
 items=data||[];render();if(show)status(items.length?items.length+" notification(s) loaded.":"You have no notifications yet.");
}
function render(){
 const unread=items.filter(x=>!x.is_read).length;
 $("unreadCount").textContent=unread+" unread";
 $("markAll").disabled=busy||unread===0;$("clearRead").disabled=busy||!items.some(x=>x.is_read);
 const visible=items.filter(x=>filter==="unread"?!x.is_read:filter==="read"?x.is_read:true);
 const list=$("notificationList");list.replaceChildren();
 if(!visible.length){const empty=document.createElement("div");empty.className="empty";empty.textContent=filter==="unread"?"You're all caught up.":filter==="read"?"No read notifications.":"No notifications yet. Messages from the DelightVendorEdit team will appear here.";list.append(empty);return;}
 visible.forEach(n=>{
  const card=document.createElement("article");card.className="item"+(!n.is_read?" unread":"");
  const ico=document.createElement("div");ico.className="item-icon";ico.textContent="♧";ico.setAttribute("aria-hidden","true");
  const content=document.createElement("div");content.className="content";
  const h=document.createElement("h2");h.textContent=n.title||"Notification";
  const p=document.createElement("p");p.textContent=n.message||"";
  content.append(h,p);
  if(n.image_url){const img=document.createElement("img");img.className="item-image";img.src=n.image_url;img.alt="Image attached to notification";img.loading="lazy";img.referrerPolicy="no-referrer";content.append(img);}
  const time=document.createElement("time");time.dateTime=n.created_at||"";time.textContent=date(n.created_at);
  const category=document.createElement("div");category.style.cssText="font-size:11px;color:#d8b75f;margin-top:7px";category.textContent=String(n.category||"general").replace(/[_-]/g," ");content.append(category,time);
  const actions=document.createElement("div");actions.className="actions";
  if(!n.is_read){const b=document.createElement("button");b.className="small";b.textContent="Mark as read";b.addEventListener("click",()=>markOne(n.id));actions.append(b);}
  const del=document.createElement("button");del.className="small";del.textContent="Delete";del.addEventListener("click",()=>deleteOne(n.id));actions.append(del);
  card.append(ico,content,actions);list.append(card);
 });
}
async function markOne(id){
 if(busy)return;setBusy(true);const {error}=await db.from("notifications").update({is_read:true,read_at:new Date().toISOString()}).eq("id",id).eq("recipient_user_id",userId);
 setBusy(false);if(error){console.error(error);status("Could not mark notification as read.","error");return;}await load(false);status("Notification marked as read.","success");
}
$("markAll").addEventListener("click",async()=>{
 if(busy||!items.some(n=>!n.is_read))return;setBusy(true);
 const {error}=await db.from("notifications").update({is_read:true,read_at:new Date().toISOString()}).eq("recipient_user_id",userId).eq("is_read",false);
 setBusy(false);if(error){console.error(error);status("Could not mark all as read.","error");return;}await load(false);status("All notifications marked as read.","success");
});
async function deleteOne(id){
 if(busy||!confirm("Delete this notification?"))return;setBusy(true);
 const {error}=await db.from("notifications").delete().eq("id",id).eq("recipient_user_id",userId);
 setBusy(false);if(error){console.error(error);status("Could not delete notification.","error");return;}await load(false);status("Notification deleted.","success");
}
$("clearRead").addEventListener("click",async()=>{
 if(busy||!items.some(n=>n.is_read)||!confirm("Delete all read notifications? This cannot be undone."))return;setBusy(true);
 const {error}=await db.from("notifications").delete().eq("recipient_user_id",userId).eq("is_read",true);
 setBusy(false);if(error){console.error(error);status("Could not clear read notifications.","error");return;}await load(false);status("Read notifications cleared.","success");
});
$("refresh").addEventListener("click",()=>load(true));
document.querySelectorAll("[data-filter]").forEach(b=>b.addEventListener("click",()=>{filter=b.dataset.filter;document.querySelectorAll("[data-filter]").forEach(x=>x.classList.toggle("active",x===b));render();}));
function realtime(){
 if(channel)db.removeChannel(channel);
 channel=db.channel("dve-notifications-"+userId).on("postgres_changes",{event:"*",schema:"public",table:"notifications",filter:"recipient_user_id=eq."+userId},()=>load(false)).subscribe();
}
async function init(){
 try{const {data,error}=await db.auth.getUser();if(error||!data?.user){location.replace("login.html");return;}userId=data.user.id;await load();realtime();}
 catch(e){console.error(e);status("Could not connect to your account. Refresh and try again.","error");}
}
window.addEventListener("beforeunload",()=>{if(channel)db.removeChannel(channel);});
init();
})();
</script>
</body>
</html>
