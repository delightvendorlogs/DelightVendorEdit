
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080808">
  <meta name="description" content="View your DelightVendorEdit notifications.">
  <title>Notifications — DelightVendorEdit</title>

  <link rel="icon" type="image/png" href="assets/dv-logo.png">
  <link rel="apple-touch-icon" href="assets/dv-logo.png">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #080808;
      --panel: #111;
      --panel2: #191919;
      --gold: #e7b94a;
      --gold-light: #f7d77e;
      --text: #f5f5f5;
      --muted: #a3a3a3;
      --border: #303030;
      --success: #8ce5a8;
      --danger: #ff9292;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background: radial-gradient(ellipse at top, #211b0c, transparent 48%), var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    button { font: inherit; }
    a { color: var(--gold); text-decoration: none; }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      padding: 16px clamp(15px, 4vw, 48px);
      border-bottom: 1px solid #29251a;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--text);
      font-size: clamp(16px, 2.5vw, 22px);
      font-weight: 800;
    }

    .brand img {
      width: 42px;
      height: 42px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .back-link { font-size: 13px; font-weight: 700; white-space: nowrap; }

    main {
      width: 100%;
      max-width: 900px;
      margin: auto;
      padding: 34px 18px 55px;
    }

    .heading {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 25px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(27px, 5vw, 36px);
      letter-spacing: -.7px;
    }

    .intro {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    .count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 35px;
      height: 35px;
      padding: 0 10px;
      border: 1px solid #4b3d1c;
      border-radius: 30px;
      background: #211b0e;
      color: var(--gold-light);
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 17px;
    }

    .btn {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      min-height: 43px;
      padding: 11px 15px;
      border: 1px solid #393939;
      border-radius: 10px;
      background: var(--panel2);
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-primary {
      color: #171107;
      background: linear-gradient(135deg, var(--gold-light), var(--gold));
      border-color: transparent;
    }

    .btn-danger {
      color: #ffb1b1;
      border-color: #643131;
      background: #251313;
    }

    .btn:disabled { opacity: .5; cursor: not-allowed; }

    .filters {
      display: flex;
      gap: 8px;
      margin-bottom: 17px;
      overflow-x: auto;
    }

    .filter {
      padding: 9px 14px;
      border: 1px solid #343434;
      border-radius: 30px;
      background: #111;
      color: #c9c9c9;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
    }

    .filter.active {
      color: var(--gold-light);
      border-color: #70551b;
      background: #211b0e;
    }

    .notice {
      display: none;
      padding: 13px 14px;
      border-radius: 10px;
      margin-bottom: 17px;
      font-size: 13px;
      line-height: 1.6;
    }

    .notice.show { display: block; }
    .notice.info { color: var(--gold-light); background: #211b0e; border: 1px solid #4b3d1c; }
    .notice.error { color: var(--danger); background: #251313; border: 1px solid #643131; }

    .list {
      display: grid;
      gap: 12px;
    }

    .item {
      display: grid;
      grid-template-columns: 46px minmax(0, 1fr) auto;
      gap: 14px;
      align-items: start;
      padding: 20px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 15px;
    }

    .item.unread {
      border-color: #5b481d;
      background: linear-gradient(110deg, #19160e, #111);
    }

    .item-icon {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 13px;
      background: #211b0e;
      color: var(--gold-light);
      font-size: 20px;
    }

    .item h2 {
      margin: 0 0 7px;
      font-size: 15px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .item p {
      margin: 0 0 10px;
      color: #b2b2b2;
      font-size: 13px;
      line-height: 1.7;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .item time {
      color: #818181;
      font-size: 11px;
    }

    .item-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .small-btn {
      padding: 7px 9px;
      border: 1px solid #383838;
      border-radius: 8px;
      background: #191919;
      color: #ddd;
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
    }

    .empty {
      padding: 50px 20px;
      text-align: center;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
    }

    .empty-icon { font-size: 35px; margin-bottom: 12px; }

    .empty h2 { margin: 0 0 8px; font-size: 18px; }

    .empty p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .loading {
      padding: 28px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 15px;
      color: var(--muted);
      font-size: 14px;
    }

    footer {
      padding: 20px;
      text-align: center;
      color: #777;
      font-size: 12px;
    }

    @media (max-width: 600px) {
      .topbar { padding: 13px; }
      .brand img { width: 36px; height: 36px; }
      .back-link { font-size: 12px; }
      main { padding: 25px 13px 40px; }
      .heading { gap: 10px; }
      .item {
        grid-template-columns: 38px minmax(0, 1fr);
        gap: 11px;
        padding: 15px;
      }
      .item-icon { width: 38px; height: 38px; font-size: 17px; }
      .item-actions {
        grid-column: 2;
        flex-direction: row;
        flex-wrap: wrap;
      }
      .toolbar .btn { flex: 1; }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <a class="brand" href="dashboard.html">
      <img src="assets/dv-logo.png" alt="DV logo"
           onerror="this.style.display='none'">
      <span>DelightVendorEdit</span>
    </a>
    <a class="back-link" href="dashboard.html">← Dashboard</a>
  </header>

  <main>
    <div class="heading">
      <div>
        <h1>Notifications</h1>
        <p class="intro">Keep track of updates saved on this device.</p>
      </div>
      <span class="count" id="unreadCount">0 unread</span>
    </div>

    <div id="notice" class="notice" role="status"></div>

    <div class="toolbar">
      <button class="btn btn-primary" id="markAllButton" type="button">
        Mark All as Read
      </button>
      <button class="btn" id="clearReadButton" type="button">
        Clear Read
      </button>
    </div>

    <div class="filters" role="group" aria-label="Notification filters">
      <button class="filter active" data-filter="all" type="button">All</button>
      <button class="filter" data-filter="unread" type="button">Unread</button>
      <button class="filter" data-filter="read" type="button">Read</button>
    </div>

    <div id="notificationList" class="loading">
      Checking your session and loading notifications…
    </div>
  </main>

  <footer>
    &copy; <span id="year"></span> DelightVendorEdit. All rights reserved.
  </footer>

  <script>
    (() => {
      "use strict";

      const SUPABASE_URL =
        "https://genlmqzkjouinofkitqt.supabase.co";

      const SUPABASE_ANON_KEY =
        "sb_publishable_8uj618f_n35zeF3Fcyt5VA_xLHHOkNv";

      const supabase = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );

      const list = document.getElementById("notificationList");
      const unreadCount = document.getElementById("unreadCount");
      const notice = document.getElementById("notice");

      let currentUserId = null;
      let notifications = [];
      let activeFilter = "all";

      const storageKey = () =>
        "dve_notifications_" + currentUserId;

      document.getElementById("year").textContent =
        new Date().getFullYear();

      function showNotice(text, type = "info") {
        notice.textContent = text;
        notice.className = "notice show " + type;
      }

      function hideNotice() {
        notice.textContent = "";
        notice.className = "notice";
      }

      function saveNotifications() {
        try {
          localStorage.setItem(storageKey(), JSON.stringify(notifications));
          return true;
        } catch (error) {
          console.error("Could not save notifications:", error);
          showNotice(
            "Your browser could not save these notifications. Check your browser storage settings.",
            "error"
          );
          return false;
        }
      }

      function loadNotifications() {
        try {
          const raw = localStorage.getItem(storageKey());
          if (!raw) return [];

          const parsed = JSON.parse(raw);
          if (!Array.isArray(parsed)) return [];

          // Accept only the expected local notification fields.
          return parsed.filter(item =>
            item &&
            typeof item.id === "string" &&
            typeof item.title === "string" &&
            typeof item.body === "string" &&
            typeof item.read === "boolean" &&
            typeof item.createdAt === "string"
          );
        } catch (error) {
          console.error("Could not read notifications:", error);
          return [];
        }
      }

      function updateCount() {
        const count = notifications.filter(item => !item.read).length;
        unreadCount.textContent = count + (count === 1 ? " unread" : " unread");
        document.getElementById("markAllButton").disabled = count === 0;
        document.getElementById("clearReadButton").disabled =
          !notifications.some(item => item.read);
      }

      function formatDate(value) {
        const date = new Date(value);

        if (Number.isNaN(date.getTime())) return "Date unavailable";

        return date.toLocaleString(undefined, {
          year: "numeric",
          month: "short",
          day: "numeric",
          hour: "numeric",
          minute: "2-digit"
        });
      }

      function makeButton(label, action, id) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "small-btn";
        button.textContent = label;
        button.addEventListener("click", () => action(id));
        return button;
      }

      function render() {
        updateCount();
        list.replaceChildren();

        const visible = notifications
          .filter(item => {
            if (activeFilter === "unread") return !item.read;
            if (activeFilter === "read") return item.read;
            return true;
          })
          .sort((a, b) =>
            new Date(b.createdAt).getTime() -
            new Date(a.createdAt).getTime()
          );

        if (!visible.length) {
          const empty = document.createElement("section");
          empty.className = "empty";

          const icon = document.createElement("div");
          icon.className = "empty-icon";
          icon.textContent = "🔔";

          const title = document.createElement("h2");
          title.textContent =
            activeFilter === "unread" ? "You're all caught up" :
            activeFilter === "read" ? "No read notifications" :
            "No notifications yet";

          const text = document.createElement("p");
          text.textContent =
            "Notifications from your account will appear here once notification delivery is connected.";

          empty.append(icon, title, text);
          list.appendChild(empty);
          return;
        }

        const container = document.createElement("div");
        container.className = "list";

        visible.forEach(item => {
          const card = document.createElement("article");
          card.className = "item" + (item.read ? "" : " unread");

          const icon = document.createElement("div");
          icon.className = "item-icon";
          icon.textContent = item.icon || "🔔";
          icon.setAttribute("aria-hidden", "true");

          const content = document.createElement("div");

          const title = document.createElement("h2");
          title.textContent = item.title;

          const body = document.createElement("p");
          body.textContent = item.body;

          const time = document.createElement("time");
          time.dateTime = item.createdAt;
          time.textContent = formatDate(item.createdAt);

          content.append(title, body, time);

          const actions = document.createElement("div");
          actions.className = "item-actions";

          if (!item.read) {
            actions.appendChild(
              makeButton("Mark Read", markRead, item.id)
            );
          }

          actions.appendChild(
            makeButton("Delete", deleteNotification, item.id)
          );

          card.append(icon, content, actions);
          container.appendChild(card);
        });

        list.appendChild(container);
      }

      function markRead(id) {
        const item = notifications.find(n => n.id === id);
        if (!item) return;

        item.read = true;
        if (saveNotifications()) {
          hideNotice();
          render();
        }
      }

      function deleteNotification(id) {
        notifications = notifications.filter(n => n.id !== id);
        if (saveNotifications()) {
          hideNotice();
          render();
        }
      }

      document.getElementById("markAllButton").addEventListener("click", () => {
        notifications.forEach(item => { item.read = true; });

        if (saveNotifications()) {
          showNotice("All notifications have been marked as read.");
          render();
        }
      });

      document.getElementById("clearReadButton").addEventListener("click", () => {
        const readCount = notifications.filter(item => item.read).length;

        if (readCount === 0) return;

        if (!window.confirm("Delete all read notifications on this device?")) {
          return;
        }

        notifications = notifications.filter(item => !item.read);

        if (saveNotifications()) {
          showNotice("Read notifications have been cleared.");
          render();
        }
      });

      document.querySelectorAll(".filter").forEach(button => {
        button.addEventListener("click", () => {
          activeFilter = button.dataset.filter;

          document.querySelectorAll(".filter").forEach(filter => {
            filter.classList.toggle("active", filter === button);
          });

          render();
        });
      });

      async function init() {
        try {
          const { data, error } = await supabase.auth.getUser();

          if (error || !data.user) {
            window.location.replace("login.html");
            return;
          }

          currentUserId = data.user.id;
          notifications = loadNotifications();

          document.getElementById("notificationList").className = "";
          hideNotice();
          render();
        } catch (error) {
          console.error("Notifications initialization failed:", error);
          list.className = "loading";
          list.textContent =
            "Could not load notifications. Check your connection and refresh the page.";
        }
      }

      init();
    })();
  </script>
</body>
</html>
