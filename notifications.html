<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080808">
<meta name="description" content="Your DelightVendorEdit notifications."><title>Notifications — DelightVendorEdit</title>
<link rel="icon" type="image/png" href="assets/dv-logo.png"><link rel="apple-touch-icon" href="assets/dv-logo.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--gold:#d4af37;--muted:#b8ad8d;--line:#493b1c;--text:#f5f0df}
*{box-sizing:border-box}body{margin:0;background:#080808;color:var(--text);font-family:Arial,Helvetica,sans-serif}
.top{display:flex;align-items:center;gap:18px;padding:18px 20px;background:#0c0c0c;border-bottom:1px solid #171717;max-width:100%;margin:auto}
.brand{display:flex;align-items:center;gap:14px;flex:1;min-width:0}.brand img{width:48px;height:48px;object-fit:contain}.brand strong{font-size:20px}
.back,.btn{border:1px solid #6d5622;background:#121212;color:var(--gold);border-radius:13px;padding:13px 18px;text-decoration:none;font-weight:800;cursor:pointer;font-size:15px}
.wrap{max-width:900px;margin:14px auto 50px;padding:0 20px}.panel{border:1px solid #3d321b;background:#121212;border-radius:30px;padding:clamp(22px,4vw,34px)}
.eyebrow{color:var(--gold);font-size:14px;font-weight:800;letter-spacing:.16em;margin:8px 0 34px}
h1{font-size:clamp(32px,6vw,54px);margin:0 0 38px;letter-spacing:-.03em}.muted{color:var(--muted);font-size:clamp(15px,3vw,22px);line-height:1.55;margin:0}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:32px 0 30px}.filter{padding:13px 24px;border:1px solid #302817;border-radius:28px;background:#080808;color:#e0d5b5;font-weight:800;font-size:17px;cursor:pointer}.filter.active{background:var(--gold);color:#111;border-color:var(--gold)}
.btn{font-size:17px;padding:13px 22px}.btn:disabled{opacity:.5;cursor:not-allowed}.notice{display:none;padding:11px 13px;border-radius:10px;font-size:13px;line-height:1.5;margin:12px 0}.notice.show{display:block}.notice.error{background:#2b1414;border:1px solid #703737;color:#ffbcbc}.notice.ok{background:#102419;border:1px solid #28623e;color:#b1f0c2}.notice.info{background:#211d10;border:1px solid #665323;color:#f1d77a}
.list{display:grid;gap:16px}.item{display:flex;align-items:flex-start;gap:16px;padding:20px;border:1px solid #3a2e13;border-radius:25px;background:#121212;cursor:pointer;text-align:left;color:inherit;width:100%}.item.unread{border-color:#8b6d20;background:linear-gradient(100deg,#1c170b,#111)}.dot{flex:0 0 16px;width:16px;height:16px;border-radius:50%;background:#514a37;margin-top:10px}.item.unread .dot{background:var(--gold)}.item-main{min-width:0;flex:1}.item h2{font-size:clamp(17px,3.3vw,24px);margin:0 0 10px;color:#f5df8d;line-height:1.35}.item p{font-size:clamp(15px,3vw,21px);line-height:1.6;margin:0;color:#c6bea9;white-space:pre-wrap;overflow-wrap:anywhere}.meta{display:block;font-size:clamp(12px,2.3vw,16px);color:#95896c;margin-top:10px}.thumb{width:92px;height:92px;object-fit:cover;border-radius:18px;border:1px solid #493b1c;flex:0 0 92px}.empty{padding:28px 15px;text-align:center;border:1px dashed #493b1c;border-radius:14px;color:var(--muted);line-height:1.6}
.modal{display:none;position:fixed;inset:0;z-index:1000;background:#080808;align-items:stretch;justify-content:stretch;padding:0}.modal.open{display:flex}.detail{width:100%;height:100%;max-height:100dvh;overflow:auto;background:#101010;padding:clamp(20px,5vw,34px);padding-bottom:max(28px,env(safe-area-inset-bottom))}.detail-top{display:flex;gap:12px;align-items:flex-start}.detail-top h2{color:#f5df8d;margin:0;flex:1;overflow-wrap:anywhere;font-size:clamp(24px,5vw,36px)}.close{background:#211d10;border:1px solid #665323;color:var(--gold);border-radius:10px;font-size:22px;width:42px;height:42px;cursor:pointer;flex:0 0 42px}.detail-message{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.8;color:#eee5cd;font-size:17px;margin:24px 0}.detail-image{display:block;width:auto;max-width:100%;max-height:68vh;object-fit:contain;border-radius:12px;border:1px solid #493b1c;margin:18px auto}.detail-date{font-size:13px;color:var(--muted);margin-top:12px}
@media(max-width:520px){.top{padding:16px 20px;gap:14px}.back{padding:18px 20px;font-size:23px;white-space:nowrap}.brand{gap:12px}.brand img{width:54px;height:54px}.brand strong{font-size:clamp(14px,3.3vw,20px)}.wrap{padding:0 20px;margin-top:14px}.panel{padding:24px;border-radius:30px}.eyebrow{margin:18px 0 34px;font-size:14px}h1{margin-bottom:38px}.actions{gap:10px;margin:32px 0 30px}.filter{padding:14px 25px;font-size:17px}.btn{font-size:17px;padding:14px 22px}.item{padding:20px;border-radius:25px;gap:14px}.thumb{width:92px;height:92px;flex-basis:92px;border-radius:18px}}
@media(max-width:390px){.top{padding:12px}.back{font-size:16px;padding:13px 12px}.brand img{width:40px;height:40px}.brand strong{font-size:14px}.wrap{padding:0 12px}.panel{padding:18px}.item{padding:14px}.thumb{width:66px;height:66px;flex-basis:66px}}
</style>
</head>
<body>
<header class="top"><a class="back" href="dashboard.html">← Back</a><div class="brand"><img src="assets/dv-logo.png" alt="DV logo"><strong>DelightVendorEdit</strong></div></header>
<main class="wrap"><section class="panel"><p class="eyebrow">YOUR ACCOUNT</p><h1>Notifications</h1>
<p class="muted">Updates sent to you by DelightVendorEdit. Tap any notification to read the full message and view its image, if attached.</p>
<div id="notice" class="notice" role="status" aria-live="polite"></div>
<div class="actions"><button class="filter active" data-filter="all" type="button">All</button><button class="filter" data-filter="unread" type="button">Unread</button><button class="filter" data-filter="read" type="button">Read</button><button class="btn" id="markAll" type="button">Mark all as read</button></div>
<div id="notificationList" class="list"><div class="empty">Loading your notifications…</div></div></section></main>
<div id="detailModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="detailTitle"><article class="detail"><div class="detail-top"><h2 id="detailTitle">Notification</h2><button class="close" id="closeDetail" type="button" aria-label="Close">×</button></div><div id="detailDate" class="detail-date"></div><div id="detailMessage" class="detail-message"></div><img id="detailImage" class="detail-image" alt="Image attached to this notification" hidden><div class="actions"><button class="btn" id="detailDone" type="button">Done</button></div></article></div>
<script>
(()=>{"use strict";
const URL="https://genlmqzkjouinofkitqt.supabase.co",KEY="sb_publishable_8uj618f_n35zeF3Fcyt5VA_xLHHOkNv",db=window.supabase.createClient(URL,KEY),$=id=>document.getElementById(id);
let userId=null,items=[],filter="all",channel=null,busy=false;
function say(msg,type="info"){const e=$("notice");e.textContent=msg;e.className="notice show "+type}
function date(v){const d=new Date(v);return Number.isNaN(d.getTime())?"Date unavailable":d.toLocaleString()}
async function load(show=true){if(!userId)return;if(show)$("notificationList").innerHTML='<div class="empty">Loading notifications…</div>';
const {data,error}=await db.from("notifications").select("id,recipient_user_id,title,message,category,is_read,read_at,created_at,image_url").eq("recipient_user_id",userId).order("created_at",{ascending:false}).limit(500);
if(error){console.error(error);say("Could not load notifications. Please refresh and try again.","error");$("notificationList").innerHTML='<div class="empty">Could not load notifications.</div>';return}
items=data||[];render()}
function render(){const visible=items.filter(n=>filter==="unread"?!n.is_read:filter==="read"?n.is_read:true),list=$("notificationList");list.replaceChildren();
if(!visible.length){const e=document.createElement("div");e.className="empty";e.textContent=filter==="unread"?"You have no unread notifications.":filter==="read"?"You have no read notifications yet.":"Notifications sent to you will appear here.";list.append(e)}
visible.forEach(n=>{const b=document.createElement("button");b.type="button";b.className="item "+(n.is_read?"read":"unread");
const dot=document.createElement("span");dot.className="dot";dot.setAttribute("aria-hidden","true");
const main=document.createElement("span");main.className="item-main";const h=document.createElement("h2");h.textContent=n.title||"Notification";
const p=document.createElement("p");const msg=String(n.message||"");p.textContent=msg.length>150?msg.slice(0,150).trimEnd()+"…":msg;
const meta=document.createElement("span");meta.className="meta";meta.textContent=date(n.created_at)+" · "+(n.is_read?"Read":"Unread");main.append(h,p,meta);b.append(dot,main);
if(n.image_url){const im=document.createElement("img");im.className="thumb";im.src=n.image_url;im.alt="";im.loading="lazy";im.addEventListener("error",()=>im.remove());b.append(im)}
b.addEventListener("click",()=>openDetail(n.id));list.append(b)});
const unread=items.filter(n=>!n.is_read).length;$("markAll").disabled=busy||unread===0}
async function openDetail(id){const n=items.find(x=>String(x.id)===String(id));if(!n)return;
$("detailTitle").textContent=n.title||"Notification";$("detailDate").textContent=date(n.created_at);$("detailMessage").textContent=n.message||"";
const im=$("detailImage");if(n.image_url){im.src=n.image_url;im.hidden=false}else{im.removeAttribute("src");im.hidden=true}
$("detailModal").classList.add("open");
if(!n.is_read){const {error}=await db.from("notifications").update({is_read:true,read_at:new Date().toISOString()}).eq("id",n.id).eq("recipient_user_id",userId);if(error){say("Notification opened, but read status could not be updated.","error");return}n.is_read=true;n.read_at=new Date().toISOString();render()}}
function closeDetail(){$("detailModal").classList.remove("open")}
$("closeDetail").onclick=closeDetail;$("detailDone").onclick=closeDetail;$("detailModal").addEventListener("click",e=>{if(e.target===$("detailModal"))closeDetail()});document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDetail()});
document.querySelectorAll("[data-filter]").forEach(b=>b.addEventListener("click",()=>{filter=b.dataset.filter;document.querySelectorAll("[data-filter]").forEach(x=>x.classList.toggle("active",x===b));render()}));
$("markAll").onclick=async()=>{if(busy||!items.some(n=>!n.is_read))return;busy=true;$("markAll").disabled=true;const {error}=await db.from("notifications").update({is_read:true,read_at:new Date().toISOString()}).eq("recipient_user_id",userId).eq("is_read",false);busy=false;if(error){say("Could not mark all notifications as read.","error");render();return}items.forEach(n=>{if(!n.is_read){n.is_read=true;n.read_at=new Date().toISOString()}});render();say("All notifications marked as read.","ok")};
async function init(){const {data,error}=await db.auth.getUser();if(error||!data?.user){location.replace("login.html");return}userId=data.user.id;await load();channel=db.channel("dve-notifications-"+userId).on("postgres_changes",{event:"*",schema:"public",table:"notifications",filter:"recipient_user_id=eq."+userId},()=>load(false)).subscribe()}
window.addEventListener("beforeunload",()=>{if(channel)db.removeChannel(channel)});init();
})();
</script>
</body></html>
