<script>
(function(){"use strict";const SUPABASE_URL="https://genlmqzkjouinofkitqt.supabase.co",KEY="sb_publishable_8uj618f_n35zeF3Fcyt5VA_xLHHOkNv";const $=id=>document.getElementById(id);let db,all=[],user=null;const esc=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const money=v=>"₦"+Number(v||0).toLocaleString("en-NG",{minimumFractionDigits:2,maximumFractionDigits:2});function status(t,k){$("status").textContent=t||"";$("status").className="status"+(k?" "+k:"")}let pendingPurchase=null;function openModal(title,text,delivery,mode){$("modalTitle").textContent=title;$("modalText").textContent=text;$("delivery").textContent=delivery||"";$("delivery").classList.toggle("hidden",!delivery);$("modalYes").classList.toggle("hidden",mode!=="confirm");$("modalNo").classList.toggle("hidden",mode!=="confirm");$("modalPurchases").classList.toggle("hidden",mode!=="success");$("closeModal").classList.toggle("hidden",mode==="confirm");$("modal").classList.remove("hidden")}function closeModal(){ $("modal").classList.add("hidden"); }$("closeModal").addEventListener("click",()=>{pendingPurchase=null;closeModal()});$("modalNo").addEventListener("click",()=>{if(pendingPurchase&&pendingPurchase.button){pendingPurchase.button.disabled=false;pendingPurchase.button.textContent="Buy now"}pendingPurchase=null;closeModal()});$("modalYes").addEventListener("click",confirmPurchase);$("refresh").addEventListener("click",load);$("search").addEventListener("input",render);$("sort").addEventListener("change",render);
function render(){const q=$("search").value.trim().toLowerCase();let rows=all.filter(p=>(p.title+" "+(p.description||"")).toLowerCase().includes(q));const s=$("sort").value;if(s==="low")rows.sort((a,b)=>Number(a.price)-Number(b.price));else if(s==="high")rows.sort((a,b)=>Number(b.price)-Number(a.price));else if(s==="az")rows.sort((a,b)=>a.title.localeCompare(b.title));else rows.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));if(!rows.length){$("products").innerHTML='<div class="empty"><strong>'+(all.length?'No matching products':'No products available yet')+'</strong>'+(all.length?'Try a different search.':'Approved seller products will appear here when available.')+'</div>';return}$("products").innerHTML=rows.map(p=>{const url=p.image_path?db.storage.from("seller-product-images").getPublicUrl(p.image_path).data.publicUrl:"";return '<article class="product">'+(url?'<img src="'+esc(url)+'" alt="'+esc(p.title)+'" loading="lazy">':'')+'<div class="body"><span class="badge">'+(p.delivery_mode==="unique"?"Unique inventory · "+Number(p.inventory_quantity||0)+" left":(p.sale_mode==="single"?"One-time item":"Multiple customers"))+'</span><h2>'+esc(p.title)+'</h2><div class="desc">Sold by: <strong>'+esc(p.seller_name||"Verified Seller")+'</strong></div>'+(p.review_summary&&p.review_summary.enabled?'<div class="desc">★ '+esc(p.review_summary.average||"—")+' · '+esc(p.review_summary.count||0)+' seller review(s)</div>':"")+(p.description?'<div class="desc">'+esc(p.description)+'</div>':'')+'<div class="price">'+money(p.price)+'</div><button class="buy" data-buy="'+esc(p.id)+'">Buy now</button></div></article>'}).join("");$("products").querySelectorAll("[data-buy]").forEach(b=>b.addEventListener("click",()=>buy(b.dataset.buy,b)))}
function makeRequestId(){return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==="x"?r:(r&3|8)).toString(16)})}
async function buy(id,button){if(pendingPurchase)return;button.disabled=true;button.textContent="Checking account…";try{const auth=await db.auth.getUser();if(auth.error)throw auth.error;user=auth.data.user;if(!user){location.href="login.html?redirect="+encodeURIComponent("explore-sellers.html");return}const product=all.find(p=>p.id===id);if(!product)throw new Error("This product is no longer available. Refresh the marketplace and try again.");button.dataset.requestId=button.dataset.requestId||makeRequestId();pendingPurchase={id,button};button.textContent="Waiting for confirmation…";openModal("Confirm purchase","Do you want to buy “"+product.title+"” for "+money(product.price)+"? The amount will be deducted from your shopping wallet only if the purchase succeeds.",null,"confirm");}catch(e){button.disabled=false;button.textContent="Buy now";openModal("Could not continue",e.message||"Please try again.",null,"error")}}async function confirmPurchase(){if(!pendingPurchase)return;const current=pendingPurchase;const button=current.button;$("modalYes").disabled=true;$("modalYes").textContent="Processing…";$("modalNo").disabled=true;try{const {data,error}=await db.rpc("purchase_seller_product",{p_product_id:current.id,p_request_id:button.dataset.requestId});if(error)throw error;const result=Array.isArray(data)?data[0]:data;if(!result||!result.ok)throw new Error(result&&result.reason||"Purchase could not be completed.");delete button.dataset.requestId;const p=all.find(x=>x.id===current.id);if(p&&result.delivery_mode==="unique")p.inventory_quantity=Number(result.inventory_remaining||0);if(result.sale_mode==="single"||result.listing_status==="sold_out")all=all.filter(x=>x.id!==current.id);render();pendingPurchase=null;openModal("Purchase successful","Your wallet was charged "+money(result.price)+". Platform fee: "+money(result.platform_fee)+". Seller payout created: "+money(result.seller_payout)+". Your delivery information is below and is also saved in Purchases.",result.delivery_info||"No delivery information returned. Open Purchases or contact support.","success");if(result.order_item_id&&confirm("Would you like to rate this seller and leave a review now? Choose Cancel to do it later.")){const rating=Number(prompt("Rate this seller from 1 to 5 stars (enter 1, 2, 3, 4 or 5):","5"));if(Number.isInteger(rating)&&rating>=1&&rating<=5){const review=prompt("Write your review (3–1,500 characters):","");if(review&&review.trim().length>=3){const submitted=await db.rpc("submit_seller_review",{p_order_item_id:result.order_item_id,p_rating:rating,p_review_text:review.trim()});if(submitted.error)alert("Purchase succeeded, but review submission failed: "+submitted.error.message);else alert("Thank you! Your review is waiting for admin approval before it appears publicly.")}}}}catch(e){const m=e.message||"Purchase could not be completed.";pendingPurchase=null;if(/insufficient fund/i.test(m))openModal("Insufficient funds","Your shopping-wallet balance is too low for this purchase. Please fund your wallet and try again.",null,"error");else openModal("Purchase not completed",m,null,"error")}finally{button.disabled=false;button.textContent="Buy now";$("modalYes").disabled=false;$("modalYes").textContent="Yes, buy now";$("modalNo").disabled=false}}
async function load(){status("Loading approved products…");$("products").innerHTML="";try{const r=await db.from("products").select("id,seller_user_id,title,description,image_path,price,sale_mode,delivery_mode,inventory_quantity,listing_status,created_at").eq("listing_status","published").order("created_at",{ascending:false});if(r.error)throw r.error;all=r.data||[];const sellerIds=[...new Set(all.map(p=>p.seller_user_id).filter(Boolean))];if(sellerIds.length){const sr=await db.from("seller_profiles").select("user_id,business_name").in("user_id",sellerIds);if(!sr.error){const names={};(sr.data||[]).forEach(x=>names[x.user_id]=x.business_name);all.forEach(p=>p.seller_name=names[p.seller_user_id]||"Verified Seller")}await Promise.all(sellerIds.map(async id=>{try{const rr=await db.rpc("get_public_seller_reviews",{p_seller_user_id:id});if(!rr.error){const v=rr.data||{};all.filter(p=>p.seller_user_id===id).forEach(p=>p.review_summary=v)}}catch(_){}}))}status(all.length?all.length+" approved product"+(all.length===1?"":"s")+" available.":"");render()}catch(e){status("Could not load products: "+e.message,"error")}}
