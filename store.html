(async()=>{"use strict";const db=supabase.createClient("https://genlmqzkjouinofkitqt.supabase.co","sb_publishable_8uj618f_n35zeF3Fcyt5VA_xLHHOkNv");const id=new URLSearchParams(location.search).get("seller"),$=x=>document.getElementById(x),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));if(!id){$("name").textContent="Seller not found";return}try{const [profile,summary,products]=await Promise.all([db.rpc("get_public_seller_profile",{p_seller_user_id:id}),db.rpc("get_public_seller_reviews",{p_seller_user_id:id}),db.from("products").select("id,title,description,image_path,price,sale_mode,delivery_mode,inventory_quantity").eq("seller_user_id",id).eq("listing_status","published").is("deleted_at",null).order("created_at",{ascending:false})]);if(profile.error)throw profile.error;if(!profile.data)throw new Error("This seller storefront is unavailable.");if(products.error)throw products.error;const p=profile.data,v=summary.data||{enabled:false,reviews:[]};$("name").textContent=p.business_name||"Seller";const levels={verified:"✓ Verified Seller",trusted:"★ Trusted Seller",top_seller:"🏆 Top Seller"};$("badge").innerHTML=levels[p.verification_level]?'<span class="badge">'+levels[p.verification_level]+'</span>':"";$("summary").textContent=v.enabled?Number(v.average||0).toFixed(1)+" / 5 · "+Number(v.count||0)+" approved reviews":"Seller reviews are currently hidden.";const rows=products.data||[];$("products").innerHTML=rows.length?rows.map(x=>{const image=x.image_path?db.storage.from("seller-product-images").getPublicUrl(x.image_path).data.publicUrl:"";return '<article class="product">'+(image?'<img src="'+esc(image)+'" alt="'+esc(x.title)+'">':'')+'<h3>'+esc(x.title)+'</h3><p class="muted">'+esc(x.description||"")+'</p><div class="price">₦'+Number(x.price||0).toLocaleString("en-NG")+'</div><a class="btn" href="explore-sellers.html">View in marketplace</a></article>'}).join(""):'<div class="empty">This seller has no published products yet.</div>';const reviews=$("reviews");if(!v.enabled||!(v.reviews||[]).length)reviews.innerHTML='<div class="empty">No approved reviews yet.</div>';else reviews.innerHTML=v.reviews.map(x=>'<article class="review"><div class="stars">'+("★".repeat(Number(x.rating)||0))+("☆".repeat(5-(Number(x.rating)||0)))+'</div><b>'+esc(x.display_name||"Customer")+'</b><div class="muted">'+new Date(x.created_at).toLocaleDateString()+'</div><p>'+esc(x.review_text)+'</p></article>').join("")}catch(e){$("name").textContent="Storefront unavailable";$("summary").textContent=e.message||"Could not load this seller."; $("products").innerHTML="";$("reviews").innerHTML=""}})();
