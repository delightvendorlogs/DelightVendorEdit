<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Seller Verification — DelightVendorEdit</title><link rel="icon" href="assets/dv-logo.png"><style>
:root{--gold:#d4af37;--muted:#b8ad8d;--line:#493b1c}*{box-sizing:border-box}body{margin:0;background:#080808;color:#f5f0df;font:14px Arial,sans-serif}.top{padding:14px;border-bottom:1px solid #302817;display:flex;align-items:center;gap:10px}.top img{width:34px;height:34px}.top b{flex:1}.top a{color:var(--gold);text-decoration:none}.wrap{max-width:900px;margin:24px auto;padding:0 14px 45px}h1{font-size:clamp(24px,5vw,34px)}.muted{color:var(--muted);font-size:12px;line-height:1.6}.panel{border:1px solid var(--line);background:#111;border-radius:13px;padding:15px;margin:10px 0}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.btn{border:1px solid #806521;border-radius:9px;padding:10px 12px;background:#211a0b;color:#f3d77d;font-weight:800;cursor:pointer}.btn.primary{background:var(--gold);color:#111}input,select,textarea{width:100%;padding:11px;border:1px solid #59471e;border-radius:9px;background:#080808;color:white;font:inherit;margin:6px 0}.badge{display:inline-block;border:1px solid #806521;border-radius:20px;padding:5px 9px;color:#f0d77a;font-size:11px}.status{margin:12px 0;color:#b8ad8d}.error{color:#ffaaaa}.hidden{display:none!important}
</style></head><body><header class="top"><img src="assets/dv-logo.png" alt=""><b>DelightVendorEdit · Seller Verification</b><a href="admin.html">Main Admin</a></header><main class="wrap"><h1>Seller verification controls</h1><p class="muted">Assign public trust badges to approved sellers. These badges are controlled by admins only.</p><div id="status" class="status">Checking admin access…</div><section id="app" class="hidden"><input id="search" placeholder="Search seller or business name"><div id="list"></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(()=>{"use strict";const db=supabase.createClient("https://genlmqzkjouinofkitqt.supabase.co","sb_publishable_8uj618f_n35zeF3Fcyt5VA_xLHHOkNv");const $=id=>document.getElementById(id);let sellers=[];
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function status(t,bad=false){$("status").textContent=t;$("status").className="status"+(bad?" error":"")}
function render(){const q=$("search").value.trim().toLowerCase();const rows=sellers.filter(x=>(x.business_name+" "+x.user_id).toLowerCase().includes(q));$("list").innerHTML=rows.length?rows.map(x=>'<article class="panel" data-id="'+x.user_id+'"><div class="row"><div><b>'+esc(x.business_name)+'</b><div class="muted">Seller ID: '+esc(x.user_id)+'</div><div class="muted">Current badge: '+esc(x.verification_level||"none")+'</div></div><span class="badge">'+esc(x.seller_status)+'</span></div><select class="level"><option value="none">No badge</option><option value="verified">Verified Seller</option><option value="trusted">Trusted Seller</option><option value="top_seller">Top Seller</option></select><textarea class="note" placeholder="Optional internal admin note">'+esc(x.verification_note||"")+'</textarea><button class="btn primary save">Save badge</button></article>').join(""):'<div class="panel muted">No matching approved sellers.</div>';
$("list").querySelectorAll("[data-id]").forEach(el=>{const seller=sellers.find(x=>x.user_id===el.dataset.id);el.querySelector(".level").value=seller.verification_level||"none";el.querySelector(".save").onclick=async()=>{const b=el.querySelector(".save");b.disabled=true;try{const {data,error}=await db.rpc("dv_admin_set_seller_verification",{p_seller_user_id:seller.user_id,p_level:el.querySelector(".level").value,p_note:el.querySelector(".note").value});if(error)throw error;if(!data?.ok)throw new Error("Badge could not be saved.");status("Seller badge updated.");await load()}catch(e){status(e.message||"Could not save badge.",true)}finally{b.disabled=false}}});
}
async function load(){const {data,error}=await db.from("seller_profiles").select("user_id,business_name,seller_status,verification_level,verification_note").eq("seller_status","approved").order("business_name");if(error)throw error;sellers=data||[];render()}
$("search").addEventListener("input",render);
(async()=>{const {data:{user},error}=await db.auth.getUser();if(error||!user){location.href="login.html?redirect="+encodeURIComponent("admin-seller-verification.html");return}const a=await db.rpc("is_admin");if(a.error||a.data!==true){status("Administrator access required.",true);return}$("app").classList.remove("hidden");status("Admin access verified.");await load()})().catch(e=>status(e.message,true));
})();
</script></body></html>
