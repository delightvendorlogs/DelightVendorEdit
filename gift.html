<!DOCTYPE html>
<html lang="en"><head>
<script>document.documentElement.style.visibility="hidden";</script><script src="auth-guard.js"></script>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090909">
<title>Gifts — DelightVendorEdit</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{color-scheme:dark;--bg:#090909;--panel:#151515;--gold:#e7b84b;--muted:#aaa69c;--line:#ffffff18}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% -10%,#e7b84b20,transparent 40%),var(--bg);color:#f5f3ed;font-family:Arial,sans-serif}.top{position:sticky;top:0;background:#090909eF;border-bottom:1px solid var(--line);z-index:5}.topin,main{width:min(1100px,calc(100% - 30px));margin:auto}.topin{display:flex;justify-content:space-between;align-items:center;padding:13px 0}.brand{font-weight:800;color:#f5d47e}.link,button{border:1px solid #e7b84b55;border-radius:10px;padding:11px 14px;background:#191919;color:#f5d47e;font-weight:700;cursor:pointer}.primary{background:linear-gradient(135deg,#f5d47e,#c89428);color:#171107;border:0}.muted{color:var(--muted)}main{padding:28px 0 60px}h1{font-size:clamp(28px,5vw,40px);margin:0 0 8px}.intro{margin-bottom:22px}.balance{padding:18px 20px;border:1px solid #e7b84b55;border-radius:16px;background:#e7b84b12;display:flex;justify-content:space-between;align-items:center;gap:12px;margin:20px 0}.balance strong{font-size:25px}.tools{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.tools input,.tools select,.field input,.field textarea{background:#101010;border:1px solid var(--line);border-radius:10px;color:white;padding:12px;width:100%;min-width:0}.tools input{max-width:340px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:13px}.product{background:linear-gradient(145deg,#1a1a1a,#101010);border:1px solid var(--line);border-radius:15px;padding:16px;display:flex;flex-direction:column;min-height:170px}.product h3{font-size:15px;margin:0 0 7px}.product p{font-size:12px;line-height:1.5}.price{font-size:18px;font-weight:800;color:#f5d47e;margin:auto 0 12px}.product button{width:100%}.panel{background:#151515;border:1px solid var(--line);border-radius:16px;padding:18px;margin:18px 0}.hidden{display:none!important}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field label{display:block;font-size:12px;color:#d7c99f;margin-bottom:6px}.field textarea{min-height:90px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.notice{padding:12px;border-radius:10px;background:#e7b84b12;color:#e9d9ae;font-size:12px;line-height:1.6}.status{font-size:13px;margin:12px 0}.status.error{color:#ff9a9a}.status.ok{color:#8ee2ac}@media(max-width:600px){.balance{align-items:flex-start;flex-direction:column}.fields{grid-template-columns:1fr}.topin,main{width:calc(100% - 24px)}}
</style></head><body>
<header class="top"><div class="topin"><a class="brand" href="dashboard.html">DelightVendorEdit · Gifts</a><a class="link" href="dashboard.html">← Dashboard</a></div></header>
<main><section class="intro"><p class="muted">THOUGHTFUL SURPRISES, DELIVERED</p><h1>Send a Gift 🎁</h1><p class="muted">Choose a gift, enter the delivery details and review your quote before paying from your wallet.</p></section>
<section class="balance"><div><div class="muted">Available wallet balance</div><strong id="balance">Loading…</strong></div><a class="link primary" href="wallet.html">＋ Fund wallet</a></section>
<div class="tools"><input id="search" placeholder="Search gifts…"><select id="country"><option value="">Choose country</option></select><select id="category"><option value="">All gift categories</option></select><select id="delivery"><option value="normal">Standard delivery</option><option value="fast">Fast delivery</option></select><button id="reload">Refresh</button></div>
<div id="status" class="status">Loading available gifts…</div><section id="catalog" class="grid"></section>
<section id="detail" class="panel hidden"><button id="back">← Back to gifts</button><h2 id="giftName">Gift details</h2><p id="giftDescription" class="muted"></p><h3>Sender and recipient</h3><div id="contacts" class="fields"><div class="field"><label>Sender name *</label><input id="senderName" required></div><div class="field"><label>Sender email *</label><input id="senderEmail" type="email" required></div><div class="field"><label>Sender phone</label><input id="senderPhone" type="tel"></div><div class="field"><label>Recipient name *</label><input id="recipientName" required></div><div class="field"><label>Recipient email</label><input id="recipientEmail" type="email"></div><div class="field"><label>Recipient phone *</label><input id="recipientPhone" type="tel" required></div><div class="field"><label>Delivery address *</label><textarea id="address" required></textarea></div><div class="field"><label>Love note (optional)</label><textarea id="loveNote" maxlength="500"></textarea></div><div class="field"><label>Special instructions (optional)</label><textarea id="specialInstructions"></textarea></div></div><div id="requirements" class="fields"></div><div class="actions"><label class="link">Add attachment (optional) <input id="upload" type="file" hidden></label><button id="quote" class="primary">Get quote</button></div><div id="quoteInfo" class="notice hidden"></div><div id="detailStatus" class="status"></div><button id="order" class="primary hidden">Place order & pay</button></section>
</main>
<script>
"use strict";
(()=>{
const URL="https://genlmqzkjouinofkitqt.supabase.co",KEY="sb_publishable_8uj618f_n35zeF3Fcyt5VA_xLHHOkNv",db=window.supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true}});
const $=id=>document.getElementById(id),money=n=>"₦"+Number(n||0).toLocaleString("en-NG",{minimumFractionDigits:2,maximumFractionDigits:2});
let products=[],selected=null,quote=null,uploadRef=null,requirements=[];
async function api(action,body={},extra={}){const {data,error}=await db.functions.invoke("thegiftunc-proxy",{body:{action,body,...extra}});if(error)throw Error(error.message||"Request failed");if(data?.error)throw Error(data.error);return data}
function status(msg,kind=""){ $("status").textContent=msg;$("status").className="status "+kind}
async function balance(){const {data:{user}}=await db.auth.getUser();if(!user){location.replace("login.html");return}const {data,error}=await db.from("wallets").select("available_balance").eq("user_id",user.id).eq("wallet_type","shopping").eq("currency","NGN").maybeSingle();if(error)throw error;$("balance").textContent=data?money(data.available_balance):"Wallet not set up"}
function draw(){const term=$("search").value.toLowerCase(),cat=$("category").value;const list=products.filter(p=>(!cat||String(p.category_id||p.category_name)===cat)&&(!term||String(p.product_name||"").toLowerCase().includes(term)));$("catalog").replaceChildren();if(!list.length){$("catalog").textContent="No gifts match this search.";return}list.forEach(p=>{const card=document.createElement("article");card.className="product";const h=document.createElement("h3");h.textContent=p.product_name;const d=document.createElement("p");d.className="muted";d.textContent=p.category_name||"Gift";const price=document.createElement("div");price.className="price";price.textContent=money(p.sellingPrice);const b=document.createElement("button");b.textContent="View gift";b.onclick=()=>openGift(p);card.append(h,d,price,b);$("catalog").append(card)})}
async function load(){status("Loading available gifts…");try{const f=await api("giftFilters");const filter=f.result||{};const countries=filter.countries||filter.available?.countries||[];$("country").replaceChildren();countries.forEach(x=>{const o=document.createElement("option");o.value=String(x.code||x.countryCode||x.iso2||x.id||x);o.textContent=String(x.name||x.label||x);$("country").append(o)});if(filter.defaultCountry)$("country").value=String(filter.defaultCountry.code||filter.defaultCountry);const d=await api("giftCatalog",{}, {query:{country:$("country").value}});products=Array.isArray(d.result)?d.result:[];const cats=[...new Map(products.map(p=>[String(p.category_id||p.category_name),p.category_name||"Gifts"]))];$("category").innerHTML='<option value="">All gift categories</option>';cats.forEach(([id,name])=>{const o=document.createElement("option");o.value=id;o.textContent=name;$("category").append(o)});draw();status(products.length?products.length+" gifts available.":"No gifts are currently available.","")}catch(e){status(e.message,"error")}}
function fieldsFrom(list){requirements=Array.isArray(list)?list:[];$("requirements").replaceChildren();requirements.forEach((f,i)=>{const key=String(f.key||f.name||f.field||f.id||"field_"+i),label=String(f.label||f.name||key),wrap=document.createElement("div");wrap.className="field";const l=document.createElement("label");l.textContent=label+(f.required===false?"":" *");let input;if(String(f.type||"").includes("select")&&Array.isArray(f.options)){input=document.createElement("select");f.options.forEach(x=>{const o=document.createElement("option");o.value=typeof x==="object"?(x.value??x.id??x.label):x;o.textContent=typeof x==="object"?(x.label??x.name??x.value):x;input.append(o)})}else if(String(f.type||"").includes("textarea"))input=document.createElement("textarea");else{input=document.createElement("input");input.type=["email","tel","date","number"].includes(f.type)?f.type:"text"}input.dataset.key=key;input.required=f.required!==false;input.placeholder=f.placeholder||"";wrap.append(l,input);$("requirements").append(wrap)})}
async function openGift(p){selected=p;quote=null;uploadRef=null;$("catalog").classList.add("hidden");$("detail").classList.remove("hidden");$("giftName").textContent=p.product_name;$("giftDescription").textContent=p.raw_data?.description||p.raw_data?.details||"";$("requirements").textContent="Loading delivery requirements…";$("quoteInfo").classList.add("hidden");$("order").classList.add("hidden");$("detailStatus").textContent="";try{const [detail,req]=await Promise.all([api("giftDetail",{}, {id:p.provider_product_id,query:{country:$("country").value}}),api("giftRequirements",{}, {id:p.provider_product_id,query:{country:$("country").value}})]);const root=detail.result?.data||detail.result?.gift||detail.result;const form=req.result?.data||req.result?.requirements||req.result;const fields=Array.isArray(form)?form:(form?.fields||form?.requirements||[]);fieldsFrom(fields);const addChoice=(key,label,values)=>{if(!Array.isArray(values)||!values.length)return;const wrap=document.createElement("div");wrap.className="field";const l=document.createElement("label");l.textContent=label;const sel=document.createElement("select");sel.dataset.key=key;sel.required=true;values.forEach(v=>{const o=document.createElement("option");o.value=String(v.id??v.value??v.name??"");o.textContent=String(v.name??v.label??v.value??v.id??"");sel.append(o)});wrap.append(l,sel);$("requirements").append(wrap)};addChoice("colorId","Color",root.colors||p.colors);addChoice("sizeId","Size",root.sizes||p.sizes);addChoice("optionId","Gift option",root.options||p.options);if(root?.customization?.text||p.raw_data?.customization?.text){const wrap=document.createElement("div");wrap.className="field";wrap.innerHTML='<label>Personal message</label><textarea data-key="customText" maxlength="500" placeholder="Write a personal message"></textarea>';$("requirements").append(wrap)}if(!fields.length){$("requirements").innerHTML='<div class="field"><label>Recipient / delivery details</label><textarea data-key="recipientDetails" placeholder="Enter the recipient name, phone, address and any instructions"></textarea></div>'}if(root?.description)$("giftDescription").textContent=root.description}catch(e){$("detailStatus").textContent=e.message}}
function collect(){const out={};$("requirements").querySelectorAll("input,textarea,select").forEach(el=>{if(el.required&&!el.value.trim())throw Error("Please complete "+(el.previousElementSibling?.textContent||"all required fields"));out[el.dataset.key]=el.value});return out}
$("quote").onclick=async()=>{try{const details=collect();$("detailStatus").textContent="Preparing your quote…";const d=await api("giftQuote",{giftId:selected.provider_product_id,countryCode:$("country").value,deliveryType:$("delivery").value,...details,customImageIds:uploadRef?[uploadRef]:[]});quote=d.result;$("quoteInfo").textContent="Your selling price: "+money(d.sellingPrice??selected.sellingPrice)+". Provider quote received. Final amount is confirmed before payment.";$("quoteInfo").classList.remove("hidden");$("order").classList.remove("hidden");$("detailStatus").textContent="Quote ready."}catch(e){$("detailStatus").textContent=e.message}};
$("order").onclick=async()=>{try{if(!quote)throw Error("Get a fresh quote first.");const details=collect();$("order").disabled=true;$("detailStatus").textContent="Submitting your Gift order…";const required=["senderName","senderEmail","recipientName","recipientPhone","address"];for(const id of required)if(!$ (id).value.trim())throw Error("Please complete "+id.replace(/([A-Z])/g," $1").toLowerCase());const order={giftId:selected.provider_product_id,countryCode:$("country").value,deliveryType:$("delivery").value,expectedPrice:Number(quote?.price??quote?.total??0),fields:details,sender:{name:$("senderName").value,email:$("senderEmail").value,phone:$("senderPhone").value},recipient:{name:$("recipientName").value,email:$("recipientEmail").value,phone:$("recipientPhone").value},address:{address:$("address").value,countryCode:$("country").value},loveNote:$("loveNote").value,specialInstructions:$("specialInstructions").value};if(uploadRef)order.upload=uploadRef;const d=await api("giftOrder",{productId:selected.provider_product_id,giftId:selected.provider_product_id,quote,order});$("detailStatus").textContent="Gift order submitted successfully. "+(d.orderNumber?"Reference: "+d.orderNumber:"");$("order").classList.add("hidden");await balance()}catch(e){$("detailStatus").textContent=e.message}finally{$("order").disabled=false}};
$("upload").onchange=async e=>{const file=e.target.files?.[0];if(!file)return;if(!["image/jpeg","image/png","image/webp","image/gif"].includes(file.type)||file.size>5*1024*1024){$("detailStatus").textContent="Choose a JPG, PNG, WebP or GIF image no larger than 5 MB.";e.target.value="";return}try{const base64=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(",")[1]);r.onerror=reject;r.readAsDataURL(file)});const d=await api("giftUpload",{fileName:file.name,mimeType:file.type||"application/octet-stream",file:base64});uploadRef=d.result?.url||d.result?.path||d.result?.id||d.result;$("detailStatus").textContent="Attachment uploaded."}catch(err){$("detailStatus").textContent=err.message}};
$("back").onclick=()=>{$("detail").classList.add("hidden");$("catalog").classList.remove("hidden")};$("search").oninput=draw;$("category").onchange=draw;$("country").onchange=load;$("reload").onclick=load;
(async()=>{try{await balance();await load()}catch(e){status(e.message,"error")}})();
})();
</script></body></html>
