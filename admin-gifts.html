<!doctype html><html><head><script>document.documentElement.style.visibility="hidden";</script><script src="auth-guard.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gift Pricing</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{background:#090909;color:#eee;font:14px Arial;margin:24px}main{max-width:1100px;margin:auto}.panel{background:#171717;padding:16px;border-radius:12px;margin:15px 0}button,input,select{padding:10px;background:#101010;color:white;border:1px solid #a9873d;border-radius:8px;margin:4px}button{cursor:pointer;color:#f5d47e}.item{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr;gap:6px;padding:10px;border-bottom:1px solid #333}.muted{color:#aaa}#status{margin:12px 0}@media(max-width:650px){.item{grid-template-columns:1fr 1fr}.name{grid-column:1/-1}}</style></head><body><main><h1>Gift Pricing & Catalogue</h1><p class="muted">Reseller cost is your provider cost. Selling price is what customers pay.</p><p><a href="admin.html">← Admin</a> <button id="sync">Sync gifts</button> <button id="reload">Refresh</button></p><section class="panel"><h3>Apply pricing to all gifts</h3><select id="bulkMode"><option value="markup">Markup %</option><option value="fixed">Fixed selling price</option></select><input id="bulkValue" type="number" min="0" placeholder="Enter amount"><button id="apply">Apply to all gifts</button><p class="muted">Bulk changes can be customized per gift below.</p></section><div id="status">Loading…</div><section class="panel"><div class="item"><b>Gift / reseller cost</b><b>Mode</b><b>Markup %</b><b>Fixed price</b><b>Save</b></div><div id="list"></div></section></main><script>(()=>{const db=window.supabase.createClient("https://genlmqzkjouinofkitqt.supabase.co","sb_publishable_8uj618f_n35zeF3Fcyt5VA_xLHHOkNv"),$=x=>document.getElementById(x);let items=[];async function call(action,body={}){const {data,error}=await db.functions.invoke("thegiftunc-proxy",{body:{action,body}});if(error)throw Error(error.message);if(data?.error)throw Error(data.error);return data}function msg(t){$("status").textContent=t}async function load(){try{const d=await call("giftAdminList");items=d.products||[];$("list").replaceChildren();items.forEach(p=>{const r=document.createElement("div");r.className="item";const n=document.createElement("div");n.className="name";n.textContent=p.product_name+" · Reseller cost ₦"+Number(p.provider_price).toLocaleString();const m=document.createElement("select");m.innerHTML="<option value=markup>Markup</option><option value=fixed>Fixed</option>";m.value=p.pricing_mode||"markup";const mk=document.createElement("input");mk.type="number";mk.value=p.markup_percent??0;const fx=document.createElement("input");fx.type="number";fx.value=p.fixed_price??"";const b=document.createElement("button");b.textContent="Save";b.onclick=async()=>{try{await call("giftAdminUpdate",{productId:p.provider_product_id,pricingMode:m.value,markupPercent:mk.value,fixedPrice:fx.value,enabled:true});msg("Saved "+p.product_name);await load()}catch(e){msg(e.message)}};r.append(n,m,mk,fx,b);$("list").append(r)});msg(items.length+" gifts loaded")}catch(e){msg(e.message)}}$("sync").onclick=async()=>{try{msg("Syncing provider gifts…");const d=await call("giftAdminSync");msg("Synced "+d.saved+" gifts.");await load()}catch(e){msg(e.message)}};$("reload").onclick=load;$("apply").onclick=async()=>{const v=Number($("bulkValue").value),mode=$("bulkMode").value;if(!items.length||!Number.isFinite(v)||v<0||(mode==="fixed"&&v===0)){msg("Sync gifts and enter a valid amount.");return}try{for(const p of items)await call("giftAdminUpdate",{productId:p.provider_product_id,pricingMode:mode,markupPercent:mode==="markup"?v:0,fixedPrice:mode==="fixed"?v:null,enabled:true});msg("Pricing applied to all gifts.");await load()}catch(e){msg(e.message)}};load()})();</script></body></html>
