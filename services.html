<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080808"><title>Services — DelightVendorEdit</title><link rel="icon" href="assets/dv-logo.png"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>

</style></head><body><header class="nav"><a class="brand" href="dashboard.html"><img src="assets/dv-logo.png" alt="DV logo">DelightVendorEdit</a><div class="links"><a href="dashboard.html">Dashboard</a><a href="purchases.html">Purchases</a><a href="wallet.html">Wallet</a></div></header><main class="wrap"><h1>Services</h1><p class="muted">Choose from the services currently enabled by our admin team.</p><div id="status" class="status">Loading services…</div><div id="groups"></div></main><div class="modal" id="modal"><section class="dialog"><h2 id="serviceName">Service</h2><p id="servicePrice" class="muted"></p><div id="fields" class="fields"></div><div class="fields" style="margin-top:12px"><div><label for="quantity">Quantity</label><input id="quantity" type="number" min="1" max="1000" value="1"></div></div><div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap"><button id="buy">Confirm purchase</button><button id="close" style="background:#222;color:#fff">Cancel</button></div><div id="purchaseStatus" class="status"></div></section></div><script>
