:root{color-scheme:dark;--gold:#e9bd53;--line:#302a1c;--muted:#aaa69b}*{box-sizing:border-box}body{margin:0;background:#080808;color:#f7f4ec;font:15px/1.5 system-ui,sans-serif}a{color:var(--gold);text-decoration:none}.nav,.wrap{max-width:1050px;margin:auto;padding:16px}.nav{display:flex;align-items:center;gap:12px;border-bottom:1px solid #292929}.brand{display:flex;align-items:center;gap:9px;color:#fff;font-weight:800}.brand img{width:34px;height:34px;object-fit:contain}.links{margin-left:auto;display:flex;gap:14px}.muted{color:var(--muted)}.panel{background:#111;border:1px solid var(--line);border-radius:15px;padding:17px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}.service{background:#141414;border:1px solid #302a1c;border-radius:13px;padding:15px}.service h3{margin:0 0 5px}.service button,button{border:1px solid #73591f;border-radius:9px;padding:10px 13px;background:var(--gold);color:#171208;font-weight:800;cursor:pointer}.service button{margin-top:10px}.status{white-space:pre-wrap;background:#191919;border:1px solid #333;border-radius:10px;padding:10px;margin:12px 0}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}label{display:block;font-size:13px;color:#ddd;margin-bottom:5px}input,select,textarea{width:100%;padding:11px;border-radius:9px;border:1px solid #444;background:#080808;color:#fff;font:inherit}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;padding:16px;z-index:5}.modal.open{display:flex}.dialog{width:min(100%,540px);max-height:90vh;overflow:auto;background:#111;border:1px solid var(--gold);border-radius:16px;padding:18px}@media(max-width:600px){.fields{grid-template-columns:1fr}.links{gap:8px;font-size:12px}}

<section id="logsplugPanel"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><div><div style="color:#e5bd51;font-size:12px;font-weight:800;letter-spacing:.12em">ADDITIONAL PROVIDER</div><h2 style="margin:5px 0">LogsPlug Logs (1)</h2><p class="muted" style="margin:0">A separate catalogue. Existing services remain unchanged.</p></div><button id="lpReload" type="button">Refresh</button></div><input id="lpSearch" type="search" placeholder="Search LogsPlug logs…" style="margin-top:14px"><div id="lpCategories" class="links" style="overflow:auto;white-space:nowrap;padding:12px 0;gap:8px"></div><div id="lpMessage" class="status">Loading LogsPlug catalogue…</div><div id="lpServices" class="lp-grid"></div></section>
<div class="modal" id="lpModal"><section class="dialog"><h2 id="lpTitle">Order log</h2><p id="lpMeta" class="muted"></p><label for="lpQuantity">Quantity</label><input id="lpQuantity" type="number" min="1" max="50" value="1"><div id="lpOrderMessage" class="status" style="display:none"></div><pre id="lpCredentials" style="display:none;white-space:pre-wrap;overflow-wrap:anywhere;background:#080808;border:1px solid #4a3a1b;border-radius:10px;padding:12px;color:#f5d477;max-height:300px;overflow:auto"></pre><div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap"><button id="lpCancel" type="button" style="background:#222;color:#fff">Close</button><button id="lpConfirm" type="button">Confirm purchase</button></div></section></div></main><div class="modal" id="modal"><section class="dialog"><h2 id="serviceName">Service</h2><p id="servicePrice" class="muted"></p><div id="fields" class="fields"></div><div class="fields" style="margin-top:12px"><div><label for="quantity">Quantity</label><input id="quantity" type="number" min="1" max="1000" value="1"></div></div><div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap"><button id="buy">Confirm purchase</button><button id="close" style="background:#222;color:#fff">Cancel</button></div><div id="purchaseStatus" class="status"></div></section></div><script>
// Keep Services pages compatible with the same legacy-to-standard session migration used by login and dashboard.
try {
  const standardKey = "sb-genlmqzkjouinofkitqt-auth-token";

const URL="https://genlmqzkjouinofkitqt.supabase.co",KEY="sb_publishable_8uj618f_n35zeF3Fcyt5VA_xLHHOkNv",db=window.supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
let selected=null,items=[];const $=id=>document.getElementById(id),money=n=>"₦"+Number(n||0).toLocaleString("en-NG",{maximumFractionDigits:2});
async function call(action,body={}){const {data,error}=await db.functions.invoke("thegiftunc-proxy",{body:{action,body}});if(error)throw error;if(data?.error)throw Error(data.error);return data}
function status(t,bad=false){$("status").textContent=t;$("status").style.borderColor=bad?"#703b3b":"#333"}
function safe(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function openService(s){selected=s;$("serviceName").textContent=s.name;$("servicePrice").textContent="Selling price: "+money(s.sellingPrice)+" each";$("quantity").value=1;$("fields").replaceChildren();const fs=Array.isArray(s.service_fields)?s.service_fields:[];fs.forEach((f,i)=>{const wrap=document.createElement("div"),label=document.createElement("label"),input=document.createElement(f.type==="textarea"?"textarea":"input");const key=String(f.name||f.key||"field_"+i);label.textContent=String(f.label||f.name||key)+(f.required?" *":"");input.dataset.key=key;input.required=!!f.required;input.placeholder=String(f.placeholder||"");input.type=["email","tel","number","url"].includes(f.type)?f.type:"text";wrap.append(label,input);$("fields").append(wrap)});$("purchaseStatus").textContent="";$("modal").classList.add("open")}
async function load(){try{status("Checking your sign-in session…");const sessionResult=await Promise.race([db.auth.getSession(),new Promise((_,reject)=>setTimeout(()=>reject(new Error("Session check timed out. Please reload and sign in again.")),12000))]);if(sessionResult.error)throw sessionResult.error;const session=sessionResult.data?.session;if(!session){location.href="login.html";return}status("Loading the service catalogue…");const d=await Promise.race([call("serviceList"),new Promise((_,reject)=>setTimeout(()=>reject(new Error("The service catalogue request timed out. Please try again.")),20000))]);items=Array.isArray(d.result)?d.result:[];const groups=new Map();items.forEach(s=>{const k=s.category_name||"Other";if(!groups.has(k))groups.set(k,[]);groups.get(k).push(s)});$("groups").replaceChildren();if(!items.length){status("No services are currently enabled. Please check again later.");return}status(items.length+" available service(s).");for(const [category,services] of groups){const section=document.createElement("section");section.className="panel";const h=document.createElement("h2");h.textContent=category;section.append(h);const grid=document.createElement("div");grid.className="grid";services.forEach(s=>{const card=document.createElement("article");card.className="service";const name=document.createElement("h3");name.textContent=s.name;const price=document.createElement("p");price.className="muted";price.textContent=money(s.sellingPrice);const b=document.createElement("button");b.textContent="Continue";b.onclick=()=>openService(s);card.append(name,price,b);grid.append(card)});section.append(grid);$("groups").append(section)}}catch(e){status(e.message||"Could not load services.",true)}}
$("close").onclick=()=>$("modal").classList.remove("open");
$("buy").onclick=async()=>{if(!selected)return;const orderData={};$("fields").querySelectorAll("input,textarea").forEach(x=>orderData[x.dataset.key]=x.value.trim());if([...$("fields").querySelectorAll("input,textarea")].some(x=>x.required&&!x.value.trim())){$("purchaseStatus").textContent="Complete all required fields.";return}const quantity=Math.max(1,Math.min(1000,Number($("quantity").value)||1));if(!confirm("Confirm "+selected.name+" purchase for "+money(selected.sellingPrice*quantity)+"? This will be deducted from your shopping wallet."))return;$("buy").disabled=true;$("purchaseStatus").textContent="Processing purchase…";try{const d=await call("servicePurchase",{serviceId:selected.service_id,quantity,orderData});$("purchaseStatus").textContent="Purchase completed. Reference: "+(d.orderNumber||d.transactionId||"see Purchases");$("buy").textContent="Completed";setTimeout(()=>location.href="purchases.html",1400)}catch(e){$("purchaseStatus").textContent=e.message||"Purchase failed. Check your transactions before retrying.";$("buy").disabled=false}};

let lpLogs=[],lpCats=[],lpCategory="all",lpSelected=null;
async function lpCall(action,extra={}){const {data,error}=await db.functions.invoke("logsplug-api",{body:{action,...extra}});if(error)throw error;if(data?.error)throw Error(data.error);return data}
function lpMoney(n){return "₦"+Number(n||0).toLocaleString("en-NG",{minimumFractionDigits:2,maximumFractionDigits:2})}
function lpStatus(t,bad=false){const e=$("lpMessage");e.textContent=t;e.style.borderColor=bad?"#703b3b":"#333";e.style.color=bad?"#ffd1d1":"#f5df9b"}
function lpRenderCats(){const el=$("lpCategories");el.innerHTML='<button data-lpcat="all" style="border-radius:20px;padding:8px 12px;background:'+(lpCategory==="all"?"#e5bd51":"#171717")+';color:'+(lpCategory==="all"?"#151006":"#eee")+'">All</button>'+lpCats.map(c=>'<button data-lpcat="'+safe(c.id)+'" style="border-radius:20px;padding:8px 12px;background:'+(String(c.id)===lpCategory?"#e5bd51":"#171717")+';color:'+(String(c.id)===lpCategory?"#151006":"#eee")+'">'+safe(c.name)+'</button>').join("");el.querySelectorAll("[data-lpcat]").forEach(b=>b.onclick=()=>{lpCategory=b.dataset.lpcat;lpRenderCats();lpRenderLogs()})}
function lpRenderLogs(){const q=$("lpSearch").value.toLowerCase();const rows=lpLogs.filter(x=>(lpCategory==="all"||String(x.category_id)===lpCategory)&&(!q||(x.title+" "+x.description+" "+x.category_name+" "+x.subcategory_name).toLowerCase().includes(q)));const el=$("lpServices");if(!rows.length){el.innerHTML='<p class="muted">No LogsPlug logs match your search.</p>';return}el.innerHTML=rows.map(x=>'<article class="lp-card"><small style="color:#f5d477">'+safe(x.category_name||"Logs")+' (1)</small><h3 style="margin:0">'+safe(x.title)+'</h3><div class="muted">'+safe(x.description||x.usage||"")+'</div><div class="lp-stock">'+Number(x.available_stock||0)+' available</div><div class="lp-price">'+lpMoney(x.customer_price)+'</div><button data-lp-order="'+safe(x.id)+'" '+(!x.is_available?"disabled":"")+'>Buy log</button></article>').join("");el.querySelectorAll("[data-lp-order]").forEach(b=>b.onclick=()=>lpOpenOrder(b.dataset.lpOrder))}
async function lpLoad(){lpStatus("Loading LogsPlug catalogue…");try{const d=await lpCall("catalog",{page:1,limit:100});lpLogs=d.logs||[];lpCats=d.categories||[];lpRenderCats();lpRenderLogs();lpStatus(lpLogs.length+" LogsPlug log(s) available.")}catch(e){lpStatus(e.message||"LogsPlug catalogue is temporarily unavailable.",true);$("lpServices").innerHTML='<p class="muted">Could not load LogsPlug logs. Please refresh.</p>'}}
function lpOpenOrder(id){lpSelected=lpLogs.find(x=>String(x.id)===String(id));if(!lpSelected)return;$("lpTitle").textContent=lpSelected.title+" (1)";$("lpMeta").textContent="Unit price: "+lpMoney(lpSelected.customer_price)+" · Stock: "+lpSelected.available_stock;$("lpQuantity").value=1;$("lpOrderMessage").style.display="none";$("lpCredentials").style.display="none";$("lpConfirm").disabled=false;$("lpConfirm").textContent="Confirm purchase";$("lpConfirm").style.display="inline-block";$("lpModal").classList.add("open")}
async function lpBuy(){if(!lpSelected)return;const qty=Number($("lpQuantity").value);if(!Number.isInteger(qty)||qty<1||qty>50){lpOrderStatus("Quantity must be between 1 and 50.",true);return}if(qty>Number(lpSelected.available_stock||0)){lpOrderStatus("Not enough stock is available.",true);return}const btn=$("lpConfirm");btn.disabled=true;btn.textContent="Processing…";try{const d=await lpCall("purchase",{logId:lpSelected.id,quantity:qty,selectionType:"DEFAULT",selectedIndices:[]});if(d.reviewRequired){lpOrderStatus(d.message||"Your order needs verification. Contact support before retrying.",true);btn.style.display="none";return}lpOrderStatus(d.message||"Purchase submitted successfully.");if(d.credentials){$("lpCredentials").textContent=typeof d.credentials==="string"?d.credentials:JSON.stringify(d.credentials,null,2);$("lpCredentials").style.display="block"}btn.textContent="Purchased";await lpLoad()}catch(e){lpOrderStatus(e.message||"Purchase failed. Check your transactions before retrying.",true);btn.disabled=false;btn.textContent="Try again"}}
function lpOrderStatus(t,bad=false){$("lpOrderMessage").textContent=t;$("lpOrderMessage").style.display="block";$("lpOrderMessage").style.borderColor=bad?"#703b3b":"#28543a";$("lpOrderMessage").style.color=bad?"#ffd1d1":"#c7ffdb"}
$("lpReload").onclick=lpLoad;$("lpSearch").oninput=lpRenderLogs;$("lpCancel").onclick=()=>$("lpModal").classList.remove("open");$("lpConfirm").onclick=lpBuy;

window.addEventListener("error",e=>status("Page script error: "+(e.message||"Unknown error"),true));window.addEventListener("unhandledrejection",e=>status("Page request error: "+(e.reason?.message||String(e.reason)),true));load();lpLoad();
