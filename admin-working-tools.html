<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Working Tools Pricing — DVE</title><link rel="icon" href="assets/dv-logo.png"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{color-scheme:dark;--g:#e9bd53}*{box-sizing:border-box}body{margin:0;background:#090909;color:#f7f4ec;font:15px system-ui;padding:18px}.wrap{max-width:1050px;margin:auto}a{color:var(--g)}.panel,.tool,.status{background:#141414;border:1px solid #303030;border-radius:14px;padding:15px;margin:14px 0}.grid,.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:6px}input,select,button{background:#090909;color:#fff;border:1px solid #444;border-radius:9px;padding:11px;font:inherit}button{cursor:pointer;color:var(--g)}.primary{background:var(--g);color:#171208;font-weight:800}.muted{color:#aaa}.price{color:var(--g);font-weight:800}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}</style></head><body><main class="wrap"><p><a href="admin.html">← Main Admin</a> · <a href="tools.html">Customer page</a></p><h1>Working Tools pricing</h1><p class="muted">Global rules apply to every tool unless an individual tool overrides them.</p><div id="status" class="status">Verifying admin access…</div><section id="app" hidden><div class="panel"><h2>Global pricing</h2><div class="fields"><label class="field">Method<select id="mode"><option value="markup_amount">Add fixed markup (₦)</option><option value="markup_percent">Markup percentage (%)</option><option value="fixed">Fixed customer price (₦)</option></select></label><label class="field">Fixed price<input id="fixed" type="number" min="0"></label><label class="field">Markup amount<input id="amount" type="number" min="0" value="0"></label><label class="field">Markup percentage<input id="percent" type="number" min="0" value="0"></label></div><div class="actions"><button class="primary" id="save">Save global rule</button><button id="sync">Sync provider tools</button><button id="reload">Reload</button></div></div><h2>Services and individual prices</h2><div id="tools" class="grid"></div></section></main><script>const SUPABASE_URL="https://genlmqzkjouinofkitqt.supabase.co",KEY="sb_publishable_8uj618f_n35zeF3Fcyt5VA_xLHHOkNv";let db;const $=id=>document.getElementById(id),money=n=>"₦"+Number(n||0).toLocaleString("en-NG",{maximumFractionDigits:2});function msg(t){$("status").textContent=t}async function call(action,extra={}){const {data,error}=await db.functions.invoke("xclusiveplugs-tools",{body:{action,...extra}});if(error)throw error;if(data.error)throw Error(data.error);return data}async function load(){try{const d=await call("admin_load"),g=d.global_pricing||{};$("mode").value=g.pricing_mode||"markup_amount";$("fixed").value=g.fixed_price??"";$("amount").value=g.markup_amount??0;$("percent").value=g.markup_percent??0;const root=$("tools");root.innerHTML=(d.tools||[]).map((x,i)=>'<article class="tool" data-i="'+i+'"><h3>'+x.tool_name+'</h3><p class="muted">Provider price: '+(x.provider_price==null?"Not synced":money(x.provider_price))+'</p><label class="field">Pricing rule<select class="mode"><option value="inherit" '+(x.pricing_mode==="inherit"?"selected":"")+'>Use global rule</option><option value="fixed" '+(x.pricing_mode==="fixed"?"selected":"")+'>Fixed price</option><option value="markup_amount" '+(x.pricing_mode==="markup_amount"?"selected":"")+'>Markup amount</option><option value="markup_percent" '+(x.pricing_mode==="markup_percent"?"selected":"")+'>Markup percentage</option></select></label><div class="fields"><label class="field">Fixed price<input class="fixed" type="number" min="0" value="'+(x.fixed_price??"")+'"></label><label class="field">Markup amount<input class="amount" type="number" min="0" value="'+(x.markup_amount??0)+'"></label><label class="field">Markup %<input class="percent" type="number" min="0" value="'+(x.markup_percent??0)+'"></label></div><button class="saveTool">Save service rule</button></article>').join("")||'<div class="tool">No services synced yet. Sync after the API key has been added to DVE Edge Function secrets.</div>';root.querySelectorAll(".tool").forEach(card=>card.querySelector(".saveTool")?.addEventListener("click",async()=>{const x=d.tools[Number(card.dataset.i)];try{await call("admin_save_tool",{tool:{...x,pricing_mode:card.querySelector(".mode").value,fixed_price:card.querySelector(".fixed").value,markup_amount:card.querySelector(".amount").value,markup_percent:card.querySelector(".percent").value}});msg("Saved individual pricing for "+x.tool_name);await load()}catch(e){msg(e.message)}}));msg("Loaded "+(d.tools||[]).length+" service pricing rules.")}catch(e){msg(e.message||"Could not load pricing.")}}async function init(){try{await new Promise((r,j)=>{if(window.supabase)r();else setTimeout(()=>window.supabase? r():j(Error("Supabase client unavailable")),1500)});db=supabase.createClient(SUPABASE_URL,KEY);const {data:{session}}=await db.auth.getSession();if(!session){location.href="login.html";return}const {data,error}=await db.rpc("is_admin");if(error||data!==true){msg("Admin access required.");return}$("app").hidden=false;await load()}catch(e){msg(e.message)}}$("save").onclick=async()=>{try{await call("admin_save_global",{settings:{pricing_mode:$("mode").value,fixed_price:$("fixed").value,markup_amount:$("amount").value,markup_percent:$("percent").value}});msg("Global pricing saved.");await load()}catch(e){msg(e.message)}};$("sync").onclick=async()=>{try{const r=await call("admin_sync");msg("Synced "+r.synced+" tools.");await load()}catch(e){msg(e.message)}};$("reload").onclick=load;init();</script></body></html>
